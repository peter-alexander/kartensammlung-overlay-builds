name: Test Vienna height-sensitive clipping

on:
  push:
    branches:
      - feature/wien-lod21-height-split-pilot
    paths:
      - '.github/workflows/wien-lod21-height-split-pilot.yml'
      - 'wien-lod21/build.mjs'

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WIEN_LOD21_DOWNLOAD_PARALLEL: 2

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y unzip

      - uses: actions/download-artifact@v8
        with:
          name: wien-lod21-citywide-final-analysis
          path: /tmp/lod21-analysis
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35779704000

      - name: Prepare two height-split targets
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const wanted = new Set(["029048", "074864"]);
          const report = JSON.parse(
          	fs.readFileSync(
          		"/tmp/lod21-analysis/wien-lod21-citywide-final.json",
          		"utf8"
          	)
          );
          const candidates = (report.hybridCandidates || []).filter(
          	(item) => wanted.has(String(item.historicalCode))
          );
          if (candidates.length !== 2) {
          	throw new Error(
          		"Expected two residual height targets, got "
          		+ candidates.length
          	);
          }
          const buildings = candidates.map((candidate) => {
          	const owners = candidate.ownerBwGebIds || [];
          	if (owners.length !== 1) {
          		throw new Error(
          			candidate.historicalCode + ": expected one owner"
          		);
          	}
          	return {
          		name: "Wien LOD2.1 height split " + candidate.historicalCode,
          		historicalCode: String(candidate.historicalCode),
          		bwGebId: Number(owners[0]),
          		ksIds: candidate.ksIds,
          		sheet: String(candidate.sheet || candidate.lod21Sheet),
          		lng: Number(candidate.lng),
          		lat: Number(candidate.lat),
          		rolloutMode: "hybrid-height-split-pilot",
          		sourceMetrics: candidate.metrics
          	};
          });
          fs.writeFileSync("/tmp/height-split.json", JSON.stringify({
          	schemaVersion: 1,
          	status: "height-split-pilot",
          	zoom: 15,
          	extent: 8192,
          	buildings
          }, null, "\t") + "\n");
          console.log(JSON.stringify(buildings, null, 2));
          NODE

      - name: Build height-sensitive split targets
        env:
          WIEN_LOD21_TARGETS: /tmp/height-split.json
        run: |
          chmod +x wien-lod21/run.sh
          /usr/bin/time -v bash wien-lod21/run.sh

      - name: Audit height split
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const root = "wien-lod21/build/WienBuildingsLOD21";
          const release = JSON.parse(fs.readFileSync(root + "/release.json", "utf8"));
          const manifest = JSON.parse(fs.readFileSync(root + "/targets.json", "utf8"));
          const items = manifest.targets || [];
          if (items.length !== 2 || release.counts.targets !== 2) {
          	throw new Error("Expected exactly two height-split targets.");
          }

          const result = [];
          for (const target of items) {
          	const clip = target.historicalClip;
          	const split = clip?.heightSplit;
          	const remainder = target.hybridRemainder;
          	if (!clip || !split || !remainder) {
          		throw new Error(target.historicalCode + ": split diagnostics missing");
          	}
          	if (
          		Number(split.toleranceM) !== 0.25
          		|| Number(split.protectedParts) < 1
          		|| Number(split.compatibleParts) < 1
          	) {
          		throw new Error(
          			target.historicalCode + ": invalid protected/compatible split"
          		);
          	}
          	if (!(Number(clip.minRoofCoverageRatio) >= 0.995)) {
          		throw new Error(
          			target.historicalCode + ": incomplete clipped roof coverage"
          		);
          	}
          	if (!(Number(remainder.syntheticObjects) > 0)) {
          		throw new Error(
          			target.historicalCode + ": no current LOD1 remainder objects"
          		);
          	}
          	const protectedParts = split.parts.filter(
          		(part) => part.protectedCurrent
          	);
          	const compatibleParts = split.parts.filter(
          		(part) => !part.protectedCurrent
          	);
          	for (const part of protectedParts) {
          		if (
          			part.historicalMaxRoofZ !== null
          			&& !(Number(part.roofDeltaM) > 0.25)
          		) {
          			throw new Error(
          				target.historicalCode + ": protected part below threshold"
          			);
          		}
          	}
          	for (const part of compatibleParts) {
          		if (
          			part.historicalMaxRoofZ !== null
          			&& Number(part.roofDeltaM) > 0.2501
          		) {
          			throw new Error(
          				target.historicalCode + ": compatible part above threshold"
          			);
          		}
          	}
          	result.push({
          		historicalCode: target.historicalCode,
          		sourceMetrics: target.sourceMetrics,
          		historicalClip: clip,
          		hybridRemainder: remainder,
          		matches: target.matches
          	});
          }
          fs.writeFileSync(
          	"/tmp/height-split-summary.json",
          	JSON.stringify({ result }, null, "\t") + "\n"
          );
          console.log(JSON.stringify(result.map((item) => ({
          	code: item.historicalCode,
          	split: item.historicalClip.heightSplit,
          	clipAreaM2: item.historicalClip.clippedHistoricalAreaM2,
          	removedHistoricalAreaM2:
          		item.historicalClip.removedHistoricalAreaM2,
          	roofCoverage: item.historicalClip.minRoofCoverageRatio,
          	historicalWallCoverage:
          		item.historicalClip.geometricWallBoundaryCoverageRatio,
          	historicalUncoveredBoundaryM:
          		item.historicalClip.uncoveredWallBoundaryLengthM,
          	remainder: item.hybridRemainder
          })), null, 2));
          NODE

      - uses: actions/upload-artifact@v7
        with:
          name: wien-lod21-height-split-pilot
          path: /tmp/height-split-summary.json
          if-no-files-found: error
          retention-days: 5
