name: Assess NÖ water services

on:
  push:
    branches: [main]
    paths:
      - 'server-catalogs/noe-water-assessment.mjs'
      - '.github/workflows/noe-water-assessment.yml'

permissions:
  contents: write

jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
      - run: node server-catalogs/noe-water-assessment.mjs
      - name: Record assessment
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- server-catalogs/noe-water-assessment.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server-catalogs/noe-water-assessment.json
          git commit -m "Record NÖ water service assessment"
          git push
