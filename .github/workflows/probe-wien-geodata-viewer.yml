name: Probe Vienna geodata viewer download API

on:
  push:
    branches:
      - probe/wien-lod21-missing-buildings
    paths:
      - '.github/workflows/probe-wien-geodata-viewer.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Inspect viewer assets and download endpoints
        run: |
          set -euo pipefail
          mkdir -p /tmp/ma41
          curl -fsSL -A "kartensammlung-overlay-builds/wien-viewer-probe" \
            "https://www.wien.gv.at/MA41datenviewer/public/" \
            -o /tmp/ma41/index.html

          echo "=== SCRIPT SOURCES ==="
          grep -Eo '<script[^>]+src="[^"]+"' /tmp/ma41/index.html \
            | sed -E 's/.*src="([^"]+)".*/\1/' \
            | tee /tmp/ma41/scripts.txt

          while IFS= read -r src; do
            case "$src" in
              http://*|https://*) url="$src" ;;
              /*) url="https://www.wien.gv.at$src" ;;
              *) url="https://www.wien.gv.at/MA41datenviewer/public/$src" ;;
            esac
            file="/tmp/ma41/$(basename "${src%%\?*}")"
            curl -fsSL -A "kartensammlung-overlay-builds/wien-viewer-probe" "$url" -o "$file" || true
          done < /tmp/ma41/scripts.txt

          echo "=== INDEX AROUND LOD2 THEME ==="
          grep -n -C 5 'generalisiertesDachmodell' /tmp/ma41/index.html | head -n 160 || true

          control="/tmp/ma41/ControlScript.ctrl"
          echo "=== CONTROL SCRIPT DOWNLOAD ENDPOINTS ==="
          grep -Eo '[A-Za-z0-9_./-]+\.ctrl[^"'"'"' ]*' "$control" \
            | sort -u \
            | grep -Ei 'download|geo|feature|select|export|data|file' \
            | head -n 200 || true

          echo "=== CONTROL SCRIPT LOD/DOWNLOAD CONTEXT ==="
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("/tmp/ma41/ControlScript.ctrl").read_text(errors="ignore")
          for pat in ["generalisiertesDachmodell","Dachmodell","Download","download","CityGML","GML","zip","Geodaten"]:
          	print("\n###",pat)
          	count=0
          	for m in re.finditer(pat,s,re.I):
          		print(s[max(0,m.start()-650):min(len(s),m.end()+1000)].replace("\n"," "))
          		count+=1
          		if count>=6: break
          PY
