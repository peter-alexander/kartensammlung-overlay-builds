name: Inspect AustriaTech ÖV-Güteklassen source
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/oev-geodaten-audit.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download official national 2025 revised ZIP
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 240 \
            'https://files.austriatech.at/d/33971b2d51a348a5958d/files/?dl=1&p=%2FOeV_Gueteklassen_2025_nap_revised.zip' \
            --output /tmp/oev.zip
          file /tmp/oev.zip
          du -h /tmp/oev.zip
          unzip -Z -l /tmp/oev.zip | head -80
          python3 -m pip install --quiet --break-system-packages pyshp
          python3 - <<'PY'
          import zipfile, tempfile, os, shapefile
          archive=zipfile.ZipFile('/tmp/oev.zip')
          names=[n for n in archive.namelist() if n.endswith('.shp') and ('20251022' in n or '20251029' in n) and '/OeV_Gueteklassen_Raster_' not in n]
          for shp in names:
              root=os.path.dirname(shp)
              base=os.path.basename(shp)[:-4]
              with tempfile.TemporaryDirectory() as tmp:
                  for ext in ['shp','shx','dbf','prj']:
                      n=f'{root}/{base}.{ext}'
                      if n in archive.namelist():
                          open(os.path.join(tmp,base+'.'+ext),'wb').write(archive.read(n))
                  r=shapefile.Reader(os.path.join(tmp,base+'.shp'))
                  print('SHAPEFILE_META',shp, 'features',len(r), 'bbox',r.bbox,
                      'fields',[f[0] for f in r.fields[1:]],
                      'sample_records',[x.as_dict() for x in r.iterRecords()][:5])
          PY
