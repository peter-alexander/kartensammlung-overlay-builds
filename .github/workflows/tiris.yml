name: Refresh tiris catalog

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tiris/**'
      - '.github/workflows/tiris.yml'
  push:
    branches:
      - main
    paths:
      - 'tiris/**'
      - '.github/workflows/tiris.yml'
  schedule:
    - cron: '17 3 * * 1'

concurrency:
  group: tiris-catalog
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MAIN_FTP_HOST: ${{ secrets.MAIN_FTP_HOST }}
      MAIN_FTP_USER: ${{ secrets.MAIN_FTP_USER }}
      MAIN_FTP_PASSWORD: ${{ secrets.MAIN_FTP_PASSWORD }}
      MAIN_REMOTE_ROOT: ${{ vars.MAIN_REMOTE_ROOT }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Test tiris catalog builder
        run: node --test tiris/test.mjs
      - name: Build tiris catalog
        run: node tiris/build.mjs
      - name: Compare current catalog
        id: changed
        run: |
          if curl -fsS --max-time 15 -o /tmp/tiris-current.json \
            https://fahrrad.lima-city.de/Maps/ServerNames/TirisCatalog.json \
            && cmp -s /tmp/tiris-current.json tiris/build/TirisCatalog.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload changed tiris catalog
        if: github.event_name != 'pull_request' && steps.changed.outputs.changed == 'true'
        run: |
          test -n "$MAIN_REMOTE_ROOT"
          chmod +x .github/scripts/main-ftp-upload-file.sh
          .github/scripts/main-ftp-upload-file.sh \
            tiris/build/TirisCatalog.json \
            "${MAIN_REMOTE_ROOT%/}/ServerNames/TirisCatalog.json"
