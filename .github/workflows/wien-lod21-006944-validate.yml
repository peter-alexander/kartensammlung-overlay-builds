name: Validate Vienna LOD2.1 006944

on:
  push:
    branches:
      - fix/wien-lod21-006944
    paths:
      - "wien-lod21/**"
      - ".github/workflows/wien-lod21-006944-validate.yml"

permissions:
  contents: read

concurrency:
  group: wien-lod21-006944-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WIEN_LOD21_TARGETS: wien-lod21/targets.production.json

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Check production scripts
        run: |
          node --check wien-lod21/make-production-targets.mjs
          node --check wien-lod21/validate-production.mjs
          node --check wien-lod21/build.mjs

      - name: Build Vienna LOD2.1 production fallback
        run: |
          chmod +x wien-lod21/run.sh
          /usr/bin/time -v bash wien-lod21/run.sh

      - name: Validate production output
        run: node wien-lod21/validate-production.mjs wien-lod21/build/WienBuildingsLOD21

      - name: Inspect 006944 output
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const root = "wien-lod21/build/WienBuildingsLOD21";
          const release = JSON.parse(fs.readFileSync(root + "/release.json", "utf8"));
          const targets = JSON.parse(fs.readFileSync(root + "/targets.json", "utf8"));
          const target = targets.targets.find(
          	(item) => String(item.historicalCode) === "006944"
          );
          if (!target) throw new Error("006944 missing from built targets");
          if (target.rolloutMode !== "hybrid-eave-clip") {
          	throw new Error("006944 has unexpected rollout mode");
          }
          console.log("RELEASE_COUNTS", JSON.stringify(release.counts));
          console.log("TARGET_006944", JSON.stringify(target));
          NODE

      - name: Upload validated production artifact
        uses: actions/upload-artifact@v7
        with:
          name: wien-lod21-006944-production
          path: wien-lod21/build/WienBuildingsLOD21/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
