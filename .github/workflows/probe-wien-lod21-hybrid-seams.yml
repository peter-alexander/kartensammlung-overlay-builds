name: Probe Vienna LOD2.1 hybrid seams

on:
  push:
    branches:
      - feature/wien-lod21-hybrid-remainder
    paths:
      - 'wien-lod21/probe-hybrid-seams.mjs'
      - '.github/workflows/probe-wien-lod21-hybrid-seams.yml'

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Download previous hybrid geometry analysis
        uses: actions/download-artifact@v8
        with:
          name: wien-lod21-hybrid-pilot-analysis
          path: /tmp/hybrid-analysis
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35794673417

      - name: Probe seam buffers
        run: |
          node wien-lod21/probe-hybrid-seams.mjs \
            /tmp/hybrid-analysis/wien-lod21-hybrid-pilot.json
