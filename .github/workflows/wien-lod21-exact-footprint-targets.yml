name: Refresh Vienna exact-footprint roof targets

on:
  push:
    branches:
      - feature/wien-maptoolkit-roof-exact-footprint
    paths:
      - '.github/workflows/wien-lod21-exact-footprint-targets.yml'

permissions:
  contents: write
  actions: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - uses: actions/download-artifact@v8
        with:
          name: wien-lod21-citywide-final-analysis
          path: /tmp/lod21-analysis
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35779704000

      - name: Generate production target snapshot
        run: |
          node wien-lod21/make-production-targets.mjs \
            --report /tmp/lod21-analysis/wien-lod21-citywide-final.json \
            --pilot wien-lod21/targets.pilot.json \
            --roof-replacements wien-lod21/maptoolkit-roof-overrides.production.json \
            --output wien-lod21/targets.production.json \
            --include-hybrid-a \
            --include-hybrid-b-absolute \
            --include-hybrid-b-thin \
            --include-hybrid-b-clip \
            --include-hybrid-c-clip \
            --include-hybrid-d-clip \
            --include-hybrid-eave-clip \
            --include-hybrid-height-split \
            --include-maptoolkit-roof-replacements

      - name: Verify expected counts
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const data = JSON.parse(
          	fs.readFileSync("wien-lod21/targets.production.json", "utf8")
          );
          if (Number(data.counts?.total) !== 2307) {
          	throw new Error(
          		"Expected 2307 production targets, got "
          		+ data.counts?.total
          	);
          }
          if (Number(data.counts?.maptoolkitRoofReplacement) !== 34) {
          	throw new Error(
          		"Expected 34 roof replacements, got "
          		+ data.counts?.maptoolkitRoofReplacement
          	);
          }
          const exact = (data.buildings || [])
          	.filter((item) => (
          		item.auditedMaptoolkitOverride?.auditClass
          		=== "exact-footprint-flat-only"
          	))
          	.map((item) => String(item.historicalCode))
          	.sort();
          const expected = ["106027","108069","505549","507585"];
          if (JSON.stringify(exact) !== JSON.stringify(expected)) {
          	throw new Error(
          		"Unexpected exact-footprint set: " + exact.join(",")
          	);
          }
          console.log(JSON.stringify(data.counts, null, 2));
          NODE

      - name: Commit production target snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wien-lod21/targets.production.json
          git diff --cached --quiet && exit 0
          git commit -m "Regenerate Vienna exact-footprint production targets"
          git push
