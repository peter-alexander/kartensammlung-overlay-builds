name: Validate clipped Vienna roof production

on:
  push:
    branches:
      - feature/wien-maptoolkit-roof-clipped-replacements
    paths:
      - '.github/workflows/wien-maptoolkit-roof-clipped-production.yml'

permissions:
  contents: write
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WIEN_LOD21_TARGETS: wien-lod21/targets.production.json
      WIEN_LOD21_DOWNLOAD_PARALLEL: 4

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y unzip

      - uses: actions/download-artifact@v8
        with:
          name: wien-lod21-citywide-final-analysis
          path: /tmp/lod21-analysis
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35779704000

      - name: Regenerate production targets
        run: |
          node wien-lod21/make-production-targets.mjs \
            --report /tmp/lod21-analysis/wien-lod21-citywide-final.json \
            --pilot wien-lod21/targets.pilot.json \
            --roof-replacements wien-lod21/maptoolkit-roof-overrides.production.json \
            --output wien-lod21/targets.production.json \
            --include-hybrid-a \
            --include-hybrid-b-absolute \
            --include-hybrid-b-thin \
            --include-hybrid-b-clip \
            --include-hybrid-c-clip \
            --include-hybrid-d-clip \
            --include-hybrid-eave-clip \
            --include-hybrid-height-split \
            --include-maptoolkit-roof-replacements

      - name: Verify regenerated target counts
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const data = JSON.parse(
          	fs.readFileSync("wien-lod21/targets.production.json", "utf8")
          );
          if (Number(data.counts?.total) !== 2309) {
          	throw new Error(
          		"Expected 2309 production targets, got "
          		+ data.counts?.total
          	);
          }
          if (Number(data.counts?.maptoolkitRoofReplacement) !== 36) {
          	throw new Error(
          		"Expected 36 roof replacements, got "
          		+ data.counts?.maptoolkitRoofReplacement
          	);
          }
          for (const code of ["124800", "204583"]) {
          	const target = data.buildings.find(
          		(item) => String(item.historicalCode) === code
          	);
          	if (
          		target?.rolloutMode !== "maptoolkit-roof-replacement"
          		|| target?.clipHistoricalToCurrentFootprint !== true
          		|| target?.auditedHistoricalClip !== true
          		|| target?.auditedMaptoolkitOverride?.auditClass
          			!== "current-footprint-clipped-flat-only"
          	) {
          		throw new Error(
          			code + ": clipped production target metadata missing."
          		);
          	}
          }
          console.log(JSON.stringify(data.counts, null, 2));
          NODE

      - name: Build full Vienna LOD2.1 production
        run: |
          chmod +x wien-lod21/run.sh
          /usr/bin/time -v bash wien-lod21/run.sh

      - name: Validate full production output
        run: |
          node wien-lod21/validate-production.mjs \
            wien-lod21/build/WienBuildingsLOD21

      - uses: actions/upload-artifact@v7
        with:
          name: wien-lod21-clipped-production-validation
          path: wien-lod21/build/WienBuildingsLOD21/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Commit validated production target snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wien-lod21/targets.production.json
          git diff --cached --quiet && exit 0
          git commit -m "Promote clipped Vienna roof replacements"
          git push
