name: Deploy validated Vienna eave-corrected package

on:
  push:
    branches:
      - feature/wien-lod21-eave-clip-test
    paths:
      - '.github/workflows/wien-lod21-eave-deploy.yml'

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REMOTE_ROOT: ${{ vars.EASYNAME_REMOTE_ROOT }}
      EASYNAME_FTP_HOST: ${{ secrets.EASYNAME_FTP_HOST }}
      EASYNAME_FTP_USER: ${{ secrets.EASYNAME_FTP_USER }}
      EASYNAME_FTP_PASSWORD: ${{ secrets.EASYNAME_FTP_PASSWORD }}
      LFTP_PARALLEL: 6

    steps:
      - uses: actions/checkout@v7

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - uses: actions/download-artifact@v8
        with:
          name: wien-lod21-production-eave
          path: /tmp/WienBuildingsLOD21
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35906324184

      - name: Verify exact validated artifact
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const root = "/tmp/WienBuildingsLOD21";
          const release = JSON.parse(fs.readFileSync(root + "/release.json", "utf8"));
          const targets = JSON.parse(fs.readFileSync(root + "/targets.json", "utf8"));
          const expected = {
          	targets: 2271,
          	directStrong: 1209,
          	hybridA: 614,
          	hybridBAbsolute: 72,
          	hybridBThin: 3,
          	hybridBClip: 7,
          	hybridCClip: 169,
          	hybridDClip: 169,
          	hybridEaveClip: 26,
          	manualPilotStrong: 1,
          	manualPilotHybrid: 1
          };
          if (release.status !== "production") throw new Error("Not production.");
          for (const [key, value] of Object.entries(expected)) {
          	if (Number(release.counts?.[key]) !== value) {
          		throw new Error(
          			"Expected " + key + "=" + value
          			+ ", got " + release.counts?.[key]
          		);
          	}
          }
          const items = targets.targets || [];
          if (items.length !== 2271) {
          	throw new Error("Expected 2271 manifest targets.");
          }

          const clipped = items.filter((item) => (
          	item.rolloutMode === "hybrid-b-clip"
          	|| item.rolloutMode === "hybrid-c-clip"
          	|| item.rolloutMode === "hybrid-d-clip"
          	|| item.rolloutMode === "hybrid-eave-clip"
          ));
          if (clipped.length !== 371) {
          	throw new Error("Expected 371 clipped targets.");
          }

          for (const item of clipped) {
          	const clip = item.historicalClip;
          	if (!clip) throw new Error(item.historicalCode + ": clip stats missing");
          	if (Number(clip.minRoofCoverageRatio) < 0.995) {
          		throw new Error(item.historicalCode + ": roof coverage incomplete");
          	}
          	if (Number(clip.geometricWallBoundaryCoverageRatio) < 0.999) {
          		throw new Error(item.historicalCode + ": wall coverage incomplete");
          	}
          	if (Number(clip.uncoveredWallBoundaryLengthM) > 0.01) {
          		throw new Error(item.historicalCode + ": uncovered boundary");
          	}
          	if (
          		Number(clip.maxRemovedInteriorSliverHoleMeanWidthM || 0)
          		> 0.0501
          	) {
          		throw new Error(item.historicalCode + ": removed sliver hole too wide");
          	}
          }

          const eave = items.filter(
          	(item) => item.rolloutMode === "hybrid-eave-clip"
          );
          if (eave.length !== 26) throw new Error("Expected 26 eave targets.");
          for (const item of eave) {
          	if (item.auditedHeightMetric !== "median-roof-surface-minimum") {
          		throw new Error(item.historicalCode + ": eave metric mismatch");
          	}
          	if (
          		Number(item.auditedHistoricalEaveDifferenceM)
          		> Number(item.auditedHistoricalEaveToleranceM) + 1e-9
          	) {
          		throw new Error(item.historicalCode + ": eave tolerance exceeded");
          	}
          }

          console.log(JSON.stringify({
          	counts: release.counts,
          	clippedTargets: clipped.length,
          	eaveTargets: eave.length
          }, null, 2));
          NODE

      - name: Deploy exact validated artifact
        run: |
          chmod +x .github/scripts/lftp-upload.sh
          REMOTE_BASE="${REMOTE_ROOT:+$REMOTE_ROOT/}WienLOD21"
          .github/scripts/lftp-upload.sh /tmp/WienBuildingsLOD21 "$REMOTE_BASE"
