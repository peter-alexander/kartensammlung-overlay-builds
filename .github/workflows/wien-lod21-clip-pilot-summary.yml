name: Summarize Vienna clipping pilot

on:
  push:
    branches:
      - feature/wien-lod21-clip-pilot
    paths:
      - '.github/workflows/wien-lod21-clip-pilot-summary.yml'

permissions:
  contents: write
  actions: read

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: wien-lod21-clip-pilot
          path: /tmp/clip-pilot
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35852642108

      - name: Write compact clipping summary
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const release = JSON.parse(
          	fs.readFileSync("/tmp/clip-pilot/release.json", "utf8")
          );
          const manifest = JSON.parse(
          	fs.readFileSync("/tmp/clip-pilot/targets.json", "utf8")
          );
          const target = manifest.targets?.[0];
          const summary = {
          	generatedAt: release.generatedAt,
          	historicalCode: target?.historicalCode,
          	releaseCounts: release.counts,
          	historicalClip: target?.historicalClip,
          	hybridRemainder: target?.hybridRemainder,
          	matches: target?.matches
          };
          fs.writeFileSync(
          	"wien-lod21/clip-pilot-032459.generated.json",
          	JSON.stringify(summary, null, "\t") + "\n"
          );
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Commit clipping summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wien-lod21/clip-pilot-032459.generated.json
          git commit -m "Record Vienna LOD2.1 clipping pilot metrics"
          git push
