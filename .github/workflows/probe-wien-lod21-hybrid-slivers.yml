name: Probe Vienna Hybrid-A sliver geometry

on:
  push:
    branches:
      - feature/wien-lod21-hybrid-remainder
    paths:
      - '.github/workflows/probe-wien-lod21-hybrid-slivers.yml'

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y unzip

      - uses: actions/download-artifact@v8
        with:
          name: wien-lod21-citywide-final-analysis
          path: /tmp/lod21-analysis
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35779704000

      - name: Generate Hybrid-A targets
        run: |
          node wien-lod21/make-production-targets.mjs \
            --report /tmp/lod21-analysis/wien-lod21-citywide-final.json \
            --pilot wien-lod21/targets.pilot.json \
            --output /tmp/wien-lod21-hybrid-a-targets.json \
            --include-hybrid-a

      - name: Probe largest discarded-area cases
        run: |
          CODES='058209,178487,108376,092283,072790,139603,054650,099558,105431,023943,180924,186054,150521'
          node wien-lod21/analyze-hybrid-remainders.mjs \
            /tmp/wien-lod21-hybrid-a-targets.json \
            /tmp/wien-lod21-hybrid-slivers.json \
            "$CODES"

          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const data = JSON.parse(
          	fs.readFileSync("/tmp/wien-lod21-hybrid-slivers.json", "utf8")
          );
          const rows = data.report.map((item) => ({
          	code: item.historicalCode,
          	remainderAreaM2: item.remainderAreaM2,
          	components: item.remainderComponentMetrics
          }));
          console.log("HYBRID SLIVER COMPONENTS");
          console.log(JSON.stringify(rows, null, 2));
          NODE

      - uses: actions/upload-artifact@v7
        with:
          name: wien-lod21-hybrid-sliver-probe
          path: /tmp/wien-lod21-hybrid-slivers.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 6

# retry-version: 2
