name: Validate Vienna exact-footprint production

on:
  push:
    branches:
      - feature/wien-maptoolkit-roof-exact-footprint
    paths:
      - '.github/workflows/wien-lod21-exact-footprint-production-test.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WIEN_LOD21_TARGETS: wien-lod21/targets.production.json
      WIEN_LOD21_DOWNLOAD_PARALLEL: 4

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Build Vienna LOD2.1 production fallback
        run: |
          chmod +x wien-lod21/run.sh
          /usr/bin/time -v bash wien-lod21/run.sh

      - name: Validate production output
        run: |
          node wien-lod21/validate-production.mjs \
            wien-lod21/build/WienBuildingsLOD21

      - name: Verify exact-footprint replacements
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const root = "wien-lod21/build/WienBuildingsLOD21";
          const release = JSON.parse(
          	fs.readFileSync(root + "/release.json", "utf8")
          );
          const targets = JSON.parse(
          	fs.readFileSync(root + "/targets.json", "utf8")
          );
          if (Number(release.counts?.targets) !== 2307) {
          	throw new Error(
          		"Expected 2307 targets, got " + release.counts?.targets
          	);
          }
          if (Number(release.counts?.maptoolkitRoofReplacement) !== 34) {
          	throw new Error(
          		"Expected 34 roof replacements, got "
          		+ release.counts?.maptoolkitRoofReplacement
          	);
          }
          const expected = ["106027","108069","505549","507585"];
          const manifestByCode = new Map(
          	(targets.targets || []).map(
          		(item) => [String(item.historicalCode), item]
          	)
          );
          const releaseByCode = new Map(
          	(release.maptoolkitRoofOverrides?.targets || []).map(
          		(item) => [String(item.historicalCode), item]
          	)
          );
          for (const code of expected) {
          	const target = manifestByCode.get(code);
          	const override = releaseByCode.get(code);
          	if (
          		target?.auditedMaptoolkitOverride?.auditClass
          			!== "exact-footprint-flat-only"
          		|| !override
          		|| !Array.isArray(override.featureSignatures)
          		|| !override.featureSignatures.length
          	) {
          		throw new Error(code + ": exact-footprint metadata missing.");
          	}
          	if (
          		(target.matches || []).some(
          			(match) => (
          				!String(match.roofType || "")
          				|| String(match.roofType) === "FLACHDACH"
          			)
          		)
          	) {
          		throw new Error(code + ": historical roof is not non-flat.");
          	}
          }
          console.log("Exact-footprint production metadata: OK");
          NODE

      - uses: actions/upload-artifact@v7
        with:
          name: wien-lod21-production-exact-footprint
          path: wien-lod21/build/WienBuildingsLOD21/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
