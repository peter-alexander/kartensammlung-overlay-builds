name: Deploy validated Vienna Hybrid-B package

on:
  push:
    branches:
      - feature/wien-lod21-hybrid-b-absolute
    paths:
      - '.github/workflows/wien-lod21-hybrid-b-deploy.yml'

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REMOTE_ROOT: ${{ vars.EASYNAME_REMOTE_ROOT }}
      EASYNAME_FTP_HOST: ${{ secrets.EASYNAME_FTP_HOST }}
      EASYNAME_FTP_USER: ${{ secrets.EASYNAME_FTP_USER }}
      EASYNAME_FTP_PASSWORD: ${{ secrets.EASYNAME_FTP_PASSWORD }}
      LFTP_PARALLEL: 6

    steps:
      - uses: actions/checkout@v7

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - uses: actions/download-artifact@v8
        with:
          name: wien-lod21-production-hybrid-b
          path: /tmp/WienBuildingsLOD21
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35848002263

      - name: Verify validated artifact
        run: |
          test -f /tmp/WienBuildingsLOD21/release.json
          test -f /tmp/WienBuildingsLOD21/targets.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const release = JSON.parse(
          	fs.readFileSync("/tmp/WienBuildingsLOD21/release.json", "utf8")
          );
          const targets = JSON.parse(
          	fs.readFileSync("/tmp/WienBuildingsLOD21/targets.json", "utf8")
          );
          if (release.status !== "production") throw new Error("Not a production artifact.");
          if (release.counts.targets !== 1897) throw new Error("Expected 1897 release targets.");
          if (release.counts.hybridA !== 614) throw new Error("Expected 614 Hybrid-A.");
          if (release.counts.hybridBAbsolute !== 72) {
          	throw new Error("Expected 72 Hybrid-B absolute.");
          }
          if ((targets.targets || []).length !== 1897) {
          	throw new Error("Expected 1897 manifest targets.");
          }
          console.log(JSON.stringify(release.counts, null, 2));
          NODE

      - name: Deploy exact validated artifact
        run: |
          chmod +x .github/scripts/lftp-upload.sh
          REMOTE_BASE="${REMOTE_ROOT:+$REMOTE_ROOT/}WienLOD21"
          .github/scripts/lftp-upload.sh /tmp/WienBuildingsLOD21 "$REMOTE_BASE"
