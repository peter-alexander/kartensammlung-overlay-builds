name: Test Vienna shared-code clipping

on:
  push:
    branches:
      - feature/wien-lod21-shared-code-clip-test
    paths:
      - '.github/workflows/wien-lod21-shared-code-clip-test.yml'

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WIEN_LOD21_DOWNLOAD_PARALLEL: 6

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y unzip

      - uses: actions/download-artifact@v8
        with:
          name: wien-lod21-citywide-final-analysis
          path: /tmp/lod21-analysis
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35779704000

      - name: Prepare ten shared-code targets
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const wanted = new Set([
          	"007085",
          	"012252",
          	"022256",
          	"054041",
          	"054749",
          	"067474",
          	"094357",
          	"121221",
          	"211902",
          	"501059"
          ]);
          const report = JSON.parse(
          	fs.readFileSync(
          		"/tmp/lod21-analysis/wien-lod21-citywide-final.json",
          		"utf8"
          	)
          );
          const candidates = (report.results || []).filter((item) => (
          	wanted.has(String(item.historicalCode))
          	&& item.method === "historical-code"
          	&& item.lod21?.hasPitchedRoof
          	&& Array.isArray(item.ownerBwGebIds)
          	&& item.ownerBwGebIds.length === 1
          ));
          if (candidates.length !== 10) {
          	throw new Error(
          		"Expected ten shared-code candidates, got "
          		+ candidates.length
          	);
          }
          const buildings = candidates.map((candidate) => ({
          	name: "Wien LOD2.1 shared-code " + candidate.historicalCode,
          	historicalCode: String(candidate.historicalCode),
          	bwGebId: Number(candidate.ownerBwGebIds[0]),
          	ksIds: candidate.ksIds,
          	sheet: String(candidate.sheet || candidate.lod21Sheet),
          	lng: Number(candidate.lng),
          	lat: Number(candidate.lat),
          	rolloutMode: "hybrid-clip-pilot",
          	expectedHistoricalOutsideM2: Number(
          		(
          			Number(candidate.metrics?.oldArea)
          			- Number(candidate.metrics?.intersectionArea)
          		).toFixed(3)
          	),
          	sourceBand: candidate.band,
          	sourceMetrics: candidate.metrics,
          	sameCodeTotalParts: Number(candidate.sameCodeTotalParts || 0),
          	sameCodeMatchedParts: Number(candidate.sameCodeMatchedParts || 0),
          	sameCodeOwnerBwGebIds: candidate.sameCodeOwnerBwGebIds || []
          }));
          fs.writeFileSync("/tmp/shared-code.json", JSON.stringify({
          	schemaVersion: 1,
          	status: "shared-code-clip-test",
          	zoom: 15,
          	extent: 8192,
          	buildings
          }, null, "\t") + "\n");
          console.log(JSON.stringify(buildings, null, 2));
          NODE

      - name: Build shared-code clipping targets
        env:
          WIEN_LOD21_TARGETS: /tmp/shared-code.json
        run: |
          chmod +x wien-lod21/run.sh
          /usr/bin/time -v bash wien-lod21/run.sh

      - name: Audit shared-code clipped meshes
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const root = "wien-lod21/build/WienBuildingsLOD21";
          const release = JSON.parse(fs.readFileSync(root + "/release.json", "utf8"));
          const manifest = JSON.parse(fs.readFileSync(root + "/targets.json", "utf8"));
          const items = manifest.targets || [];
          if (items.length !== 10 || release.counts.targets !== 10) {
          	throw new Error("Expected ten shared-code targets.");
          }

          const failures = [];
          const rows = [];
          for (const target of items) {
          	const clip = target.historicalClip;
          	const remainder = target.hybridRemainder;
          	const expectedRemoved = Number(target.expectedHistoricalOutsideM2);
          	const removed = Number(clip?.removedHistoricalAreaM2);
          	const roofCoverage = Number(clip?.minRoofCoverageRatio);
          	const wallCoverage = Number(
          		clip?.geometricWallBoundaryCoverageRatio
          	);
          	const uncoveredBoundaryM = Number(
          		clip?.uncoveredWallBoundaryLengthM
          	);
          	const maxSliverHoleWidthM = Number(
          		clip?.maxRemovedInteriorSliverHoleMeanWidthM || 0
          	);
          	const rawRemainder = Number(remainder?.rawRemainderAreaM2 || 0);
          	const discardedRemainder = Number(
          		remainder?.discardedSliverAreaM2 || 0
          	);
          	const syntheticObjects = Number(remainder?.syntheticObjects || 0);
          	const meaningfulUnbuiltRemainder = syntheticObjects > 0
          		? 0
          		: Math.max(0, rawRemainder - discardedRemainder);

          	const reasons = [];
          	if (
          		!Number.isFinite(expectedRemoved)
          		|| !Number.isFinite(removed)
          		|| Math.abs(removed - expectedRemoved) > 0.05
          	) reasons.push("removed-area");
          	if (!Number.isFinite(roofCoverage) || roofCoverage < 0.995) {
          		reasons.push("roof-coverage");
          	}
          	if (!Number.isFinite(wallCoverage) || wallCoverage < 0.999) {
          		reasons.push("wall-coverage");
          	}
          	if (
          		!Number.isFinite(uncoveredBoundaryM)
          		|| uncoveredBoundaryM > 0.01
          	) reasons.push("uncovered-boundary");
          	if (
          		!Number.isFinite(maxSliverHoleWidthM)
          		|| maxSliverHoleWidthM > 0.0501
          	) reasons.push("sliver-hole");
          	if (meaningfulUnbuiltRemainder > 0.01) {
          		reasons.push("remainder");
          	}

          	const row = {
          		historicalCode: target.historicalCode,
          		sourceBand: target.sourceBand,
          		sourceMetrics: target.sourceMetrics,
          		sameCodeTotalParts: target.sameCodeTotalParts,
          		sameCodeMatchedParts: target.sameCodeMatchedParts,
          		sameCodeOwnerBwGebIds: target.sameCodeOwnerBwGebIds,
          		historicalClip: clip,
          		hybridRemainder: remainder,
          		matches: target.matches,
          		reasons
          	};
          	rows.push(row);
          	if (reasons.length) failures.push(row);
          }
          rows.sort((a,b) => a.historicalCode.localeCompare(b.historicalCode));
          failures.sort((a,b) => a.historicalCode.localeCompare(b.historicalCode));
          fs.writeFileSync(
          	"/tmp/shared-code-summary.json",
          	JSON.stringify({
          		total: rows.length,
          		passed: rows.length - failures.length,
          		failed: failures.length,
          		failures,
          		rows
          	}, null, "\t") + "\n"
          );
          console.log(JSON.stringify({
          	total: rows.length,
          	passed: rows.length - failures.length,
          	failed: failures.length,
          	failures: failures.map((item) => ({
          		code: item.historicalCode,
          		reasons: item.reasons
          	}))
          }, null, 2));
          if (failures.length) {
          	throw new Error(
          		"Shared-code clip audit failed for "
          		+ failures.length + " target(s)."
          	);
          }
          NODE

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wien-lod21-shared-code-clip-test
          path: /tmp/shared-code-summary.json
          if-no-files-found: warn
          retention-days: 5
