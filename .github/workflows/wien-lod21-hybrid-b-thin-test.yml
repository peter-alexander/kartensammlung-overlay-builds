name: Test Vienna Hybrid-B thin

on:
  push:
    branches:
      - feature/wien-lod21-hybrid-b-thin
    paths:
      - '.github/workflows/wien-lod21-hybrid-b-thin-test.yml'
      - 'wien-lod21/build.mjs'
      - 'wien-lod21/make-production-targets.mjs'
      - 'wien-lod21/validate-production.mjs'

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WIEN_LOD21_DOWNLOAD_PARALLEL: 3

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y unzip

      - uses: actions/download-artifact@v8
        with:
          name: wien-lod21-citywide-final-analysis
          path: /tmp/lod21-analysis
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35779704000

      - name: Generate three audited thin targets
        run: |
          node wien-lod21/make-production-targets.mjs \
            --report /tmp/lod21-analysis/wien-lod21-citywide-final.json \
            --pilot wien-lod21/targets.pilot.json \
            --output /tmp/targets.next.json \
            --include-hybrid-a \
            --include-hybrid-b-absolute \
            --include-hybrid-b-thin
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const all = JSON.parse(fs.readFileSync("/tmp/targets.next.json", "utf8"));
          const buildings = all.buildings.filter(
          	(item) => item.rolloutMode === "hybrid-b-thin"
          );
          const expected = new Set(["079387", "088019", "123321"]);
          if (buildings.length !== 3) {
          	throw new Error("Expected 3 thin targets, got " + buildings.length);
          }
          for (const item of buildings) {
          	expected.delete(String(item.historicalCode));
          	const width = Number(item.auditedHistoricalOutsideMaxMeanWidthM);
          	if (!Number.isFinite(width) || width > 0.0501) {
          		throw new Error(item.historicalCode + ": width " + width);
          	}
          }
          if (expected.size) {
          	throw new Error("Missing thin targets: " + [...expected].join(", "));
          }
          fs.writeFileSync("/tmp/targets.thin.json", JSON.stringify({
          	schemaVersion: 1,
          	status: "hybrid-b-thin-test",
          	zoom: all.zoom,
          	extent: all.extent,
          	buildings
          }, null, "\t") + "\n");
          console.log(JSON.stringify(buildings, null, 2));
          NODE

      - name: Build audited thin targets
        env:
          WIEN_LOD21_TARGETS: /tmp/targets.thin.json
        run: |
          chmod +x wien-lod21/run.sh
          /usr/bin/time -v bash wien-lod21/run.sh

      - name: Validate thin build
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const root = "wien-lod21/build/WienBuildingsLOD21";
          const release = JSON.parse(fs.readFileSync(root + "/release.json", "utf8"));
          const manifest = JSON.parse(fs.readFileSync(root + "/targets.json", "utf8"));
          const items = manifest.targets || [];
          if (items.length !== 3 || release.counts.targets !== 3) {
          	throw new Error("Expected exactly 3 built targets.");
          }
          if (Number(release.counts.hybridBThin || 0) !== 3) {
          	throw new Error("Expected 3 hybridBThin release targets.");
          }
          for (const target of items) {
          	if (target.rolloutMode !== "hybrid-b-thin") {
          		throw new Error("Unexpected mode " + target.rolloutMode);
          	}
          	const width = Number(target.auditedHistoricalOutsideMaxMeanWidthM);
          	if (!Number.isFinite(width) || width > 0.0501) {
          		throw new Error(target.historicalCode + ": invalid audited width");
          	}
          	if (!target.matches?.length) {
          		throw new Error(target.historicalCode + ": no LOD2.1 match");
          	}
          	if (!target.hybridRemainder) {
          		throw new Error(target.historicalCode + ": no hybrid stats");
          	}
          	const remainder = target.hybridRemainder;
          	const raw = Number(remainder.rawRemainderAreaM2 || 0);
          	const discarded = Number(remainder.discardedSliverAreaM2 || 0);
          	if (
          		Number(remainder.syntheticObjects || 0) <= 0
          		&& Math.max(0, raw - discarded) > 0.01
          	) {
          		throw new Error(target.historicalCode + ": meaningful current remainder missing");
          	}
          }
          console.log(JSON.stringify({
          	counts: release.counts,
          	tiles: release.tiles.presentTilesZ15.length,
          	targets: items.map((item) => ({
          		code: item.historicalCode,
          		outsideAreaM2: item.historicalOutsideCurrentM2,
          		maxMeanWidthM: item.auditedHistoricalOutsideMaxMeanWidthM,
          		remainderAreaM2: item.hybridRemainder?.remainderAreaM2
          	}))
          }, null, 2));
          NODE
