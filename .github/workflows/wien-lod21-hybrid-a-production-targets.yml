name: Refresh Vienna LOD2.1 Hybrid-A production targets

on:
  workflow_dispatch:
  push:
    branches:
      - feature/wien-lod21-hybrid-remainder
    paths:
      - '.github/workflows/wien-lod21-hybrid-a-production-targets.yml'

permissions:
  contents: write
  actions: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/wien-lod21-hybrid-remainder

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - uses: actions/download-artifact@v8
        with:
          name: wien-lod21-citywide-final-analysis
          path: /tmp/lod21-analysis
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35779704000

      - name: Generate Hybrid-A production snapshot
        run: |
          node wien-lod21/make-production-targets.mjs \
            --report /tmp/lod21-analysis/wien-lod21-citywide-final.json \
            --pilot wien-lod21/targets.pilot.json \
            --output wien-lod21/targets.production.json \
            --include-hybrid-a

      - name: Validate snapshot counts
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const input = JSON.parse(
          	fs.readFileSync("wien-lod21/targets.production.json", "utf8")
          );
          if (input.counts.total !== 1825) throw new Error("Expected 1825 targets.");
          if (input.counts.directStrong !== 1209) throw new Error("Expected 1209 direct targets.");
          if (input.counts.hybridA !== 614) throw new Error("Expected 614 Hybrid-A targets.");
          if (input.counts.manualPilotStrong !== 1) throw new Error("Expected one manual strong pilot.");
          if (input.counts.manualPilotHybrid !== 1) throw new Error("Expected one manual hybrid pilot.");
          console.log(JSON.stringify(input.counts, null, 2));
          NODE

      - name: Commit production snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wien-lod21/targets.production.json
          git diff --cached --quiet && exit 0
          git commit -m "Promote Vienna LOD2.1 Hybrid-A targets"
          git push origin HEAD:feature/wien-lod21-hybrid-remainder
