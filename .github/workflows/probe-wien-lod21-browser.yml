name: Trace Vienna LOD2.1 viewer download

on:
  push:
    branches:
      - probe/wien-lod21-missing-buildings
    paths:
      - '.github/workflows/probe-wien-lod21-browser.yml'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Playwright client
        run: npm install --no-save --package-lock=false playwright

      - name: Trace viewer
        run: |
          cat > ./trace-viewer.mjs <<'NODE'
          import { chromium } from "playwright";

          const browser = await chromium.launch({
          	channel: "chrome",
          	headless: true
          });
          const page = await browser.newPage({
          	viewport: { width: 1600, height: 1200 },
          	acceptDownloads: true
          });

          const interesting = /(?:\.ctrl|lod2|dach|download|citygml|\.gml|\.zip)/i;
          const seenBodies = new Set();

          page.on("request", (request) => {
          	const url = request.url();
          	if (interesting.test(url)) {
          		console.log("REQ", request.method(), url);
          		const post = request.postData();
          		if (post) console.log("POST", post.slice(0, 3000));
          	}
          });

          page.on("response", async (response) => {
          	const url = response.url();
          	if (!interesting.test(url)) return;
          	console.log("RES", response.status(), url);
          	if (seenBodies.has(url)) return;
          	seenBodies.add(url);
          	try {
          		const type = response.headers()["content-type"] || "";
          		const len = Number(response.headers()["content-length"] || 0);
          		if (!/(?:text|json|javascript|xml|html)/i.test(type)) return;
          		if (len && len > 2_000_000) return;
          		const body = await response.text();
          		if (/GetIdentifyLayerInfos\.ctrl/i.test(url)) {
          			for (const needle of [
          				"generalisiertesDachmodell",
          				"identifyGeneral",
          				"Generalisiertes Dachmodell"
          			]) {
          				const index = body.indexOf(needle);
          				if (index >= 0) {
          					console.log(
          						"IDENTIFY_CONFIG",
          						needle,
          						body.slice(Math.max(0, index - 3000), index + 9000).replace(/\s+/g, " ")
          					);
          				}
          			}
          		}
          		if (/lod2|dach|download|citygml|\.gml|\.zip|generalisiertesDachmodell/i.test(body)) {
          			console.log("BODY", url, body.slice(0, 12000).replace(/\s+/g, " "));
          		}
          	} catch {}
          });

          page.on("download", async (download) => {
          	console.log("DOWNLOAD", download.suggestedFilename(), download.url());
          	await download.cancel().catch(() => {});
          });
          page.on("requestfailed", (request) => {
          	console.log("FAILED", request.url(), request.failure()?.errorText);
          });

          await page.goto("https://www.wien.gv.at/MA41datenviewer/public/", {
          	waitUntil: "networkidle",
          	timeout: 90_000
          });
          console.log("TITLE", await page.title());

          const controls = await page.locator("input,button,a").evaluateAll((els) => els
          	.map((el) => ({
          		tag: el.tagName,
          		id: el.id,
          		type: el.getAttribute("type"),
          		title: el.getAttribute("title"),
          		alt: el.getAttribute("alt"),
          		text: (el.textContent || "").trim(),
          		href: el.getAttribute("href")
          	}))
          	.filter((item) => /info|ident|abfrag|auswahl|download|dach/i.test(
          		[item.id,item.title,item.alt,item.text,item.href].filter(Boolean).join(" ")
          	))
          );
          console.log("CONTROLS", JSON.stringify(controls.slice(0, 100), null, 2));

          const layer = page.locator("#layersControl_generalisiertesDachmodell_check");
          await page.locator("#layersControl_generalisiertesDachmodell_label").click();
          console.log("LAYER_CHECKED", await layer.isChecked());
          await page.waitForTimeout(2500);

          const search = page.locator("#suche_txt");
          await search.fill("Karlsplatz 13, Wien");
          await page.locator("#suche_btn_btn").click();
          await page.waitForTimeout(3500);

          const resultDump = await page.locator("a,input,button").evaluateAll((els) => els
          	.map((el) => ({
          		id: el.id,
          		title: el.getAttribute("title"),
          		text: (el.textContent || "").trim(),
          		value: el.getAttribute("value"),
          		href: el.getAttribute("href"),
          		visible: !!(el.offsetWidth || el.offsetHeight || el.getClientRects().length)
          	}))
          	.filter((item) => item.visible && (
          		/item|result|karls|1040|wien|auswahl|info|ident|abfrag/i.test(
          			[item.id,item.title,item.text,item.value,item.href].filter(Boolean).join(" ")
          		)
          	))
          );
          console.log("AFTER_SEARCH", JSON.stringify(resultDump.slice(0, 120), null, 2));

          const candidates = page.locator("#searchResult a, [id*=searchResult] a, [id*=search] a");
          const count = await candidates.count();
          console.log("SEARCH_LINKS", count);
          for (let i = 0; i < Math.min(count, 12); i += 1) {
          	const el = candidates.nth(i);
          	console.log("SEARCH_LINK", i, await el.innerText().catch(() => ""), await el.getAttribute("href"));
          }
          if (count > 0) {
          	await candidates.first().click().catch(() => {});
          	await page.waitForTimeout(3000);
          }

          const modeControls = page.locator("input,button,a");
          const modeCount = await modeControls.count();
          for (let i = 0; i < modeCount; i += 1) {
          	const el = modeControls.nth(i);
          	const data = [
          		await el.getAttribute("id"),
          		await el.getAttribute("title"),
          		await el.getAttribute("alt"),
          		await el.getAttribute("value"),
          		await el.innerText().catch(() => "")
          	].filter(Boolean).join(" ");
          	if (/ident|abfrag|information|info.*objekt|objekt.*info/i.test(data)) {
          		console.log("TRY_MODE", data);
          		await el.click().catch(() => {});
          		await page.waitForTimeout(500);
          		break;
          	}
          }

          const mapSelectors = ["#mapImage", "#mapContainer", "[id*=mapImage]"];
          let clicked = false;
          for (const selector of mapSelectors) {
          	const map = page.locator(selector).first();
          	if (await map.count()) {
          		const box = await map.boundingBox().catch(() => null);
          		if (box && box.width > 100 && box.height > 100) {
          			console.log("MAP_BOX", selector, JSON.stringify(box));
          			await map.click({
          				position: { x: box.width / 2, y: box.height / 2 }
          			}).catch((error) => console.log("MAP_CLICK_ERROR", String(error)));
          			clicked = true;
          			break;
          		}
          	}
          }
          console.log("MAP_CLICKED", clicked);
          await page.waitForTimeout(4000);

          const afterClick = await page.locator("a,input,button").evaluateAll((els) => els
          	.map((el) => ({
          		id: el.id,
          		title: el.getAttribute("title"),
          		text: (el.textContent || "").trim(),
          		value: el.getAttribute("value"),
          		href: el.getAttribute("href"),
          		visible: !!(el.offsetWidth || el.offsetHeight || el.getClientRects().length)
          	}))
          	.filter((item) => item.visible && /download|gml|zip|dach|lod2|blatt|speicher/i.test(
          		[item.id,item.title,item.text,item.value,item.href].filter(Boolean).join(" ")
          	))
          );
          console.log("AFTER_CLICK", JSON.stringify(afterClick.slice(0, 120), null, 2));

          const html = await page.content();
          for (const pattern of [
          	/href=["']([^"']*(?:\.zip|\.gml)[^"']*)["']/gi,
          	/(https?:\/\/[^"' <>]+(?:\.zip|\.gml)[^"' <>]*)/gi
          ]) {
          	for (const match of html.matchAll(pattern)) console.log("HTML_DOWNLOAD", match[1]);
          }

          await page.screenshot({ path: "/tmp/wien-lod21-viewer.png", fullPage: true });
          await browser.close();
          NODE
          node ./trace-viewer.mjs

      - name: Upload screenshot
        uses: actions/upload-artifact@v7
        with:
          name: wien-lod21-viewer-trace
          path: /tmp/wien-lod21-viewer.png
          retention-days: 2
          if-no-files-found: ignore
