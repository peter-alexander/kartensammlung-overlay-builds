name: Refresh Vienna Hybrid-B clip production targets

on:
  push:
    branches:
      - feature/wien-lod21-clip-pilot
    paths:
      - '.github/workflows/wien-lod21-clip-targets.yml'

permissions:
  contents: write
  actions: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - uses: actions/download-artifact@v8
        with:
          name: wien-lod21-citywide-final-analysis
          path: /tmp/lod21-analysis
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35779704000

      - name: Generate production target snapshot
        run: |
          node wien-lod21/make-production-targets.mjs \
            --report /tmp/lod21-analysis/wien-lod21-citywide-final.json \
            --pilot wien-lod21/targets.pilot.json \
            --output wien-lod21/targets.production.json \
            --include-hybrid-a \
            --include-hybrid-b-absolute \
            --include-hybrid-b-thin \
            --include-hybrid-b-clip

      - name: Verify production target snapshot
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const data = JSON.parse(
          	fs.readFileSync("wien-lod21/targets.production.json", "utf8")
          );
          const counts = data.counts || {};
          const expected = {
          	total: 1907,
          	directStrong: 1209,
          	hybridA: 614,
          	hybridBAbsolute: 72,
          	hybridBThin: 3,
          	hybridBClip: 7,
          	manualPilotStrong: 1,
          	manualPilotHybrid: 1
          };
          for (const [key, value] of Object.entries(expected)) {
          	if (Number(counts[key]) !== value) {
          		throw new Error(key + ": expected " + value + ", got " + counts[key]);
          	}
          }
          if (Number(data.sourceAnalysis?.hybridCandidatesDeferred) !== 367) {
          	throw new Error(
          		"Expected 367 deferred hybrids, got "
          		+ data.sourceAnalysis?.hybridCandidatesDeferred
          	);
          }
          const clip = data.buildings.filter(
          	(item) => item.rolloutMode === "hybrid-b-clip"
          );
          const wanted = new Set([
          	"011758", "032459", "045503", "047031",
          	"061091", "065479", "088729"
          ]);
          for (const item of clip) {
          	wanted.delete(String(item.historicalCode));
          	if (item.auditedHistoricalClip !== true) {
          		throw new Error(item.historicalCode + ": clip audit flag missing");
          	}
          	if (!(Number(item.historicalOutsideCurrentM2) > 0)) {
          		throw new Error(item.historicalCode + ": outside area missing");
          	}
          }
          if (wanted.size) {
          	throw new Error("Missing clip targets: " + [...wanted].join(", "));
          }
          console.log(JSON.stringify({
          	counts,
          	deferred: data.sourceAnalysis.hybridCandidatesDeferred,
          	sourceSheets: counts.sourceSheets,
          	clip: clip.map((item) => ({
          		code: item.historicalCode,
          		historicalOutsideCurrentM2: item.historicalOutsideCurrentM2
          	}))
          }, null, 2));
          NODE

      - name: Commit production target snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wien-lod21/targets.production.json
          git diff --cached --quiet && exit 0
          git commit -m "Promote audited Vienna Hybrid-B clipping targets"
          git push
