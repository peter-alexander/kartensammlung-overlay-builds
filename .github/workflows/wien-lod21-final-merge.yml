name: Finalize Vienna LOD2.1 citywide analysis

on:
  push:
    branches:
      - feature/wien-lod21-matcher
    paths:
      - '.github/workflows/wien-lod21-final-merge.yml'

permissions:
  contents: read
  actions: read

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Download successful reports from first run
        uses: actions/download-artifact@v8
        with:
          pattern: wien-lod21-match-*
          path: /tmp/lod21-batches
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35774639420

      - name: Download retried reports
        uses: actions/download-artifact@v8
        with:
          pattern: wien-lod21-retry-*
          path: /tmp/lod21-retries
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35777913884

      - name: Merge current classification
        run: |
          cp /tmp/lod21-retries/wien-lod21-matches-batch-*.json /tmp/lod21-batches/
          count="$(find /tmp/lod21-batches -maxdepth 1 -type f -name 'wien-lod21-matches-batch-*.json' | wc -l | tr -d ' ')"
          test "$count" -eq 16
          node wien-lod21/merge-match-reports.mjs \
            --input-dir /tmp/lod21-batches \
            --output /tmp/wien-lod21-citywide-final.json

      - name: Validate pilot and conservative rollout
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const report = JSON.parse(fs.readFileSync("/tmp/wien-lod21-citywide-final.json", "utf8"));
          const expected = new Map([
          	["006973", "strong"],
          	["009238", "legacy-subset"],
          	["113842", "legacy-subset"],
          	["212535", "legacy-subset"]
          ]);
          for (const item of report.pilot || []) {
          	const code = String(item.historicalCode || "");
          	if (!expected.has(code)) continue;
          	if (item.method !== "historical-code" || item.band !== expected.get(code)) {
          		throw new Error("Unexpected pilot classification for " + code);
          	}
          	expected.delete(code);
          }
          if (expected.size) {
          	throw new Error("Missing pilot codes: " + [...expected.keys()].join(", "));
          }
          if (!(report.counts.directProductionEligible > 0)) {
          	throw new Error("No direct production candidates.");
          }
          if (!(report.counts.hybridCandidates > 0)) {
          	throw new Error("No hybrid candidates.");
          }
          console.log("Final conservative rollout classification is valid.");
          NODE

      - name: Upload final report
        uses: actions/upload-artifact@v7
        with:
          name: wien-lod21-citywide-final-analysis
          path: /tmp/wien-lod21-citywide-final.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
