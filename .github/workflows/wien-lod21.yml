name: Build Vienna LOD2.1

on:
  workflow_dispatch:
  push:
    branches:
      - feature/wien-lod21-production
    paths:
      - 'wien-lod21/build.mjs'
      - 'wien-lod21/run.sh'
      - '.github/workflows/wien-lod21.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REMOTE_ROOT: ${{ vars.EASYNAME_REMOTE_ROOT }}
      EASYNAME_FTP_HOST: ${{ secrets.EASYNAME_FTP_HOST }}
      EASYNAME_FTP_USER: ${{ secrets.EASYNAME_FTP_USER }}
      EASYNAME_FTP_PASSWORD: ${{ secrets.EASYNAME_FTP_PASSWORD }}
      LFTP_PARALLEL: 6
      WIEN_LOD21_TARGETS: wien-lod21/targets.production.json

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y lftp unzip

      - name: Build Vienna LOD2.1 production fallback
        run: |
          chmod +x wien-lod21/run.sh
          /usr/bin/time -v bash wien-lod21/run.sh

      - name: Validate production output
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const root = "wien-lod21/build/WienBuildingsLOD21";
          const release = JSON.parse(fs.readFileSync(root + "/release.json", "utf8"));
          const targets = JSON.parse(fs.readFileSync(root + "/targets.json", "utf8"));

          if (release.status !== "production") {
          	throw new Error("Expected production release, got " + release.status);
          }
          if (release.counts.targets !== 1212) {
          	throw new Error("Expected 1212 targets, got " + release.counts.targets);
          }
          if (release.counts.directStrong !== 1209) {
          	throw new Error("Expected 1209 direct targets, got " + release.counts.directStrong);
          }
          if (release.counts.manualPilotHybrid !== 3) {
          	throw new Error("Expected 3 pilot hybrid exceptions, got " + release.counts.manualPilotHybrid);
          }
          if (!Array.isArray(release.tiles?.presentTilesZ15) || !release.tiles.presentTilesZ15.length) {
          	throw new Error("Production release has no Z15 tiles.");
          }
          if (targets.targets?.length !== 1212) {
          	throw new Error("Target manifest size mismatch.");
          }
          for (const target of targets.targets) {
          	if (!target.matches?.length) {
          		throw new Error("Target has no CityGML match: " + target.historicalCode);
          	}
          }

          const expectedPilots = new Set(["006973", "009238", "113842", "212535"]);
          for (const target of targets.targets) {
          	expectedPilots.delete(String(target.historicalCode));
          }
          if (expectedPilots.size) {
          	throw new Error("Missing pilot targets: " + [...expectedPilots].join(", "));
          }

          console.log(JSON.stringify({
          	status: release.status,
          	counts: release.counts,
          	sourceSheets: release.source.sheets.length,
          	releaseBytes: fs.statSync(root + "/release.json").size,
          	targetManifestBytes: fs.statSync(root + "/targets.json").size
          }, null, 2));
          NODE

      - name: Upload production artifact
        uses: actions/upload-artifact@v7
        with:
          name: wien-lod21-production
          path: wien-lod21/build/WienBuildingsLOD21/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Deploy Vienna LOD2.1 production fallback
        run: |
          chmod +x .github/scripts/lftp-upload.sh
          REMOTE_BASE="${REMOTE_ROOT:+$REMOTE_ROOT/}WienLOD21"
          .github/scripts/lftp-upload.sh wien-lod21/build/WienBuildingsLOD21 "$REMOTE_BASE"
