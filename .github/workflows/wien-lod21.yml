name: Build Vienna LOD2.1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REMOTE_ROOT: ${{ vars.EASYNAME_REMOTE_ROOT }}
      EASYNAME_FTP_HOST: ${{ secrets.EASYNAME_FTP_HOST }}
      EASYNAME_FTP_USER: ${{ secrets.EASYNAME_FTP_USER }}
      EASYNAME_FTP_PASSWORD: ${{ secrets.EASYNAME_FTP_PASSWORD }}
      LFTP_PARALLEL: 6
      WIEN_LOD21_TARGETS: wien-lod21/targets.production.json

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y lftp unzip

      - name: Build Vienna LOD2.1 production fallback
        run: |
          chmod +x wien-lod21/run.sh
          /usr/bin/time -v bash wien-lod21/run.sh

      - name: Validate production output
        run: node wien-lod21/validate-production.mjs wien-lod21/build/WienBuildingsLOD21

      - name: Upload production artifact
        uses: actions/upload-artifact@v7
        with:
          name: wien-lod21-production
          path: wien-lod21/build/WienBuildingsLOD21/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Deploy Vienna LOD2.1 production fallback
        run: |
          chmod +x .github/scripts/lftp-upload.sh
          REMOTE_BASE="${REMOTE_ROOT:+$REMOTE_ROOT/}WienBuildings/LOD21"
          .github/scripts/lftp-upload.sh wien-lod21/build/WienBuildingsLOD21 "$REMOTE_BASE"

# full-build-version: 7
