name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install npm dependencies
        run: npm ci --no-fund --no-audit

      - name: Smoke-test core dependency imports
        run: |
          node --input-type=module <<'NODE'
          await import('ol/Feature.js');
          await import('ol/format/GeoJSON.js');
          await import('ol/geom/Point.js');
          await import('ol/proj.js');
          await import('ol/sphere.js');
          await import('proj4');
          console.log('Core dependency imports OK');
          NODE
