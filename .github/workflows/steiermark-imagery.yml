name: Refresh Steiermark imagery catalog

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'steiermark/imagery-*.mjs'
      - 'steiermark/imagery-catalog.mjs'
      - '.github/workflows/steiermark-imagery.yml'
  push:
    branches:
      - main
    paths:
      - 'steiermark/imagery-*.mjs'
      - 'steiermark/imagery-catalog.mjs'
      - '.github/workflows/steiermark-imagery.yml'
  schedule:
    - cron: '19 4 * * 3'

concurrency:
  group: steiermark-imagery
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MAIN_FTP_HOST: ${{ secrets.MAIN_FTP_HOST }}
      MAIN_FTP_USER: ${{ secrets.MAIN_FTP_USER }}
      MAIN_FTP_PASSWORD: ${{ secrets.MAIN_FTP_PASSWORD }}
      MAIN_REMOTE_ROOT: ${{ vars.MAIN_REMOTE_ROOT }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - run: node --test steiermark/imagery-test.mjs
      - run: node steiermark/imagery-build.mjs
      - name: Smoke test ImageServer export
        run: node steiermark/imagery-smoke.mjs
      - name: Compare existing catalog
        id: changed
        run: |
          if curl -fsS --max-time 15 -o /tmp/steiermark-imagery.json \
            https://fahrrad.lima-city.de/Maps/ServerNames/SteiermarkImagery.json \
            && cmp -s /tmp/steiermark-imagery.json steiermark/build/SteiermarkImagery.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload changed imagery catalog
        if: github.event_name != 'pull_request' && steps.changed.outputs.changed == 'true'
        run: |
          test -n "$MAIN_REMOTE_ROOT"
          chmod +x .github/scripts/main-ftp-upload-file.sh
          .github/scripts/main-ftp-upload-file.sh \
            steiermark/build/SteiermarkImagery.json \
            "${MAIN_REMOTE_ROOT%/}/ServerNames/SteiermarkImagery.json"
