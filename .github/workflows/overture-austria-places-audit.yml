name: Audit Overture Austria places

on:
  pull_request:
    paths:
      - '.github/scripts/overture-austria-places-audit.py'
      - '.github/workflows/overture-austria-places-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install DuckDB
        run: python -m pip install duckdb==1.5.5

      - name: Audit Austrian places
        run: python .github/scripts/overture-austria-places-audit.py

      - name: Upload audit
        uses: actions/upload-artifact@v7
        with:
          name: overture-austria-places-audit
          path: austria-places-audit.json
          retention-days: 3
