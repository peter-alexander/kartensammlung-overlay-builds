name: Refresh Radkummerkasten titles

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'kuka/**'
      - '.github/scripts/lftp-upload.sh'
      - '.github/workflows/kuka.yml'
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: kuka-title-cache
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FTP_HOST: ${{ secrets.MAIN_FTP_HOST }}
      FTP_USER: ${{ secrets.MAIN_FTP_USER }}
      FTP_PASSWORD: ${{ secrets.MAIN_FTP_PASSWORD }}
      MAIN_REMOTE_ROOT: ${{ vars.MAIN_REMOTE_ROOT }}
      KUKA_CACHE_URL: https://fahrrad.lima-city.de/Maps/Kuka_Entries.json

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Refresh title cache
        run: node kuka/build.mjs

      - name: Deploy changed title cache to Lima
        run: |
          if [ ! -f kuka/build/changed ]; then
            echo "Keine neuen Radkummerkasten-Titel; kein Upload notwendig."
            exit 0
          fi

          test -n "$MAIN_REMOTE_ROOT"
          chmod +x .github/scripts/lftp-upload.sh
          .github/scripts/lftp-upload.sh \
            kuka/build/Kuka_Entries.json \
            "${MAIN_REMOTE_ROOT%/}/Kuka_Entries.json"
