name: Refresh Vienna Hybrid-C production targets

on:
  push:
    branches:
      - feature/wien-lod21-hybrid-c-clip-test
    paths:
      - '.github/workflows/wien-lod21-hybrid-c-targets.yml'

permissions:
  contents: write
  actions: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - uses: actions/download-artifact@v8
        with:
          name: wien-lod21-citywide-final-analysis
          path: /tmp/lod21-analysis
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35779704000

      - name: Generate production target snapshot
        run: |
          node wien-lod21/make-production-targets.mjs \
            --report /tmp/lod21-analysis/wien-lod21-citywide-final.json \
            --pilot wien-lod21/targets.pilot.json \
            --output wien-lod21/targets.production.json \
            --include-hybrid-a \
            --include-hybrid-b-absolute \
            --include-hybrid-b-thin \
            --include-hybrid-b-clip \
            --include-hybrid-c-clip

      - name: Verify production target snapshot
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const data = JSON.parse(
          	fs.readFileSync("wien-lod21/targets.production.json", "utf8")
          );
          const expected = {
          	total: 2076,
          	directStrong: 1209,
          	hybridA: 614,
          	hybridBAbsolute: 72,
          	hybridBThin: 3,
          	hybridBClip: 7,
          	hybridCClip: 169,
          	manualPilotStrong: 1,
          	manualPilotHybrid: 1
          };
          for (const [key, value] of Object.entries(expected)) {
          	if (Number(data.counts?.[key]) !== value) {
          		throw new Error(
          			"Expected " + key + "=" + value
          			+ ", got " + data.counts?.[key]
          		);
          	}
          }
          if (Number(data.sourceAnalysis?.hybridCandidatesDeferred) !== 198) {
          	throw new Error(
          		"Expected 198 deferred hybrid candidates, got "
          		+ data.sourceAnalysis?.hybridCandidatesDeferred
          	);
          }
          const hybridC = data.buildings.filter(
          	(item) => item.rolloutMode === "hybrid-c-clip"
          );
          if (!hybridC.every((item) => item.auditedHistoricalClip === true)) {
          	throw new Error("Hybrid-C clip target lacks audit marker.");
          }
          console.log(JSON.stringify({
          	counts: data.counts,
          	deferred: data.sourceAnalysis.hybridCandidatesDeferred,
          	hybridCSourceSheets: new Set(
          		hybridC.map((item) => item.sheet)
          	).size
          }, null, 2));
          NODE

      - name: Commit production target snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wien-lod21/targets.production.json
          git diff --cached --quiet && exit 0
          git commit -m "Promote validated Vienna Hybrid-C clipping targets"
          git push
