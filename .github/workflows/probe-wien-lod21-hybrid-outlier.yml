name: Probe Vienna Hybrid-A outlier 048966

on:
  push:
    branches:
      - feature/wien-lod21-hybrid-remainder
    paths:
      - '.github/workflows/probe-wien-lod21-hybrid-outlier.yml'

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - uses: actions/download-artifact@v8
        with:
          name: wien-lod21-citywide-final-analysis
          path: /tmp/lod21-analysis
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35779704000

      - uses: actions/download-artifact@v8
        with:
          name: wien-lod21-hybrid-a-test
          path: /tmp/hybrid-package
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35835648033

      - name: Inspect candidate and built remainder
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const report = JSON.parse(
          	fs.readFileSync("/tmp/lod21-analysis/wien-lod21-citywide-final.json", "utf8")
          );
          const targets = JSON.parse(
          	fs.readFileSync("/tmp/hybrid-package/targets.json", "utf8")
          );
          const code = "048966";
          const candidate = (report.hybridCandidates || []).find(
          	(item) => String(item.historicalCode) === code
          );
          const target = (targets.targets || []).find(
          	(item) => String(item.historicalCode) === code
          );
          if (!candidate || !target) throw new Error("048966 not found.");
          console.log(JSON.stringify({
          	candidate: {
          		historicalCode: candidate.historicalCode,
          		BW_GEB_ID: candidate.BW_GEB_ID,
          		ksIds: candidate.ksIds,
          		metrics: candidate.metrics,
          		lod21: candidate.lod21,
          		sameCodeMissingParts: candidate.sameCodeMissingParts,
          		sameCodeMatchedParts: candidate.sameCodeMatchedParts,
          		ownerBwGebIds: candidate.ownerBwGebIds
          	},
          	target: {
          		bwGebId: target.bwGebId,
          		ksIds: target.ksIds,
          		hybridRemainder: target.hybridRemainder,
          		matches: target.matches
          	}
          }, null, 2));
          NODE
