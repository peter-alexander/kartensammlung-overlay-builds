name: Build NASA GIBS catalog

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'nasa-gibs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/scripts/lftp-upload.sh'
      - '.github/workflows/nasa-gibs.yml'
  push:
    branches:
      - main
    paths:
      - 'nasa-gibs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/scripts/lftp-upload.sh'
      - '.github/workflows/nasa-gibs.yml'
  schedule:
    - cron: '43 4 * * *'

concurrency:
  group: nasa-gibs-catalog
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAPS_FTP_HOST: ${{ secrets.MAPS_FTP_HOST }}
      MAPS_FTP_USER: ${{ secrets.MAPS_FTP_USER }}
      MAPS_FTP_PASSWORD: ${{ secrets.MAPS_FTP_PASSWORD }}
      REMOTE_ROOT: /default-website/Maps
      CURRENT_CATALOG_URL: https://fahrrad.lima-city.de/Maps/Landsat/NasaGibsLayerCatalog.min.json

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --no-fund --no-audit
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Build complete NASA GIBS catalog
        run: node nasa-gibs/build.mjs

      - name: Check whether production catalog changed
        id: changed
        run: |
          if curl -fsS --retry 3 --retry-delay 2 -o /tmp/current-gibs.json "$CURRENT_CATALOG_URL" \
            && cmp -s /tmp/current-gibs.json nasa-gibs/build/NasaGibsLayerCatalog.min.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "NASA GIBS catalog unchanged."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "NASA GIBS catalog changed or current production file is unavailable."
          fi

      - name: Deploy catalog to Lima
        if: github.event_name != 'pull_request' && steps.changed.outputs.changed == 'true'
        run: |
          chmod +x .github/scripts/lftp-upload.sh
          .github/scripts/lftp-upload.sh \
            nasa-gibs/build/NasaGibsLayerCatalog.min.json \
            "${REMOTE_ROOT%/}/Landsat/NasaGibsLayerCatalog.min.json"
