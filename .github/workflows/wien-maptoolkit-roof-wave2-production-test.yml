name: Validate Vienna roof replacement wave 2 production

on:
  push:
    branches:
      - feature/wien-maptoolkit-roof-overrides-wave2
    paths:
      - '.github/workflows/wien-maptoolkit-roof-wave2-production-test.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WIEN_LOD21_TARGETS: wien-lod21/targets.production.json
      WIEN_LOD21_DOWNLOAD_PARALLEL: 6

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Build Vienna wave 2 production package
        run: |
          chmod +x wien-lod21/run.sh
          /usr/bin/time -v bash wien-lod21/run.sh

      - name: Validate Vienna wave 2 production package
        run: node wien-lod21/validate-production.mjs wien-lod21/build/WienBuildingsLOD21

      - name: Upload validated production package
        uses: actions/upload-artifact@v7
        with:
          name: wien-lod21-production-roof-wave2
          path: wien-lod21/build/WienBuildingsLOD21/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
