name: Validate Vienna roof replacement wave 2 production

on:
  push:
    branches:
      - feature/wien-maptoolkit-roof-wave2-production
    paths:
      - '.github/workflows/wien-maptoolkit-roof-wave2-production-test.yml'
      - 'wien-lod21/maptoolkit-roof-overrides.production.json'
      - 'wien-lod21/make-production-targets.mjs'
      - 'wien-lod21/build.mjs'
      - 'wien-lod21/validate-production.mjs'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WIEN_LOD21_TARGETS: wien-lod21/targets.production.json
      WIEN_LOD21_DOWNLOAD_PARALLEL: 6

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y unzip

      - uses: actions/download-artifact@v8
        with:
          name: wien-lod21-citywide-final-analysis
          path: /tmp/lod21-analysis
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35779704000

      - name: Generate production target snapshot
        run: |
          node wien-lod21/make-production-targets.mjs \
            --report /tmp/lod21-analysis/wien-lod21-citywide-final.json \
            --pilot wien-lod21/targets.pilot.json \
            --roof-replacements wien-lod21/maptoolkit-roof-overrides.production.json \
            --output wien-lod21/targets.production.json \
            --include-hybrid-a \
            --include-hybrid-b-absolute \
            --include-hybrid-b-thin \
            --include-hybrid-b-clip \
            --include-hybrid-c-clip \
            --include-hybrid-d-clip \
            --include-hybrid-eave-clip \
            --include-hybrid-height-split \
            --include-maptoolkit-roof-replacements

      - name: Verify snapshot counts
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const targets = JSON.parse(
          	fs.readFileSync("wien-lod21/targets.production.json", "utf8")
          );
          const overrides = JSON.parse(
          	fs.readFileSync(
          		"wien-lod21/maptoolkit-roof-overrides.production.json",
          		"utf8"
          	)
          );
          const replacementCount = Number(overrides.count);
          if (replacementCount !== 22) {
          	throw new Error(
          		"Expected 22 audited overrides, got " + replacementCount
          	);
          }
          if (
          	Number(targets.counts?.maptoolkitRoofReplacement)
          	!== replacementCount
          ) {
          	throw new Error("Roof replacement count mismatch.");
          }
          if (Number(targets.counts?.total) !== 2273 + replacementCount) {
          	throw new Error(
          		"Expected " + (2273 + replacementCount)
          		+ " total targets, got " + targets.counts?.total
          	);
          }
          console.log(JSON.stringify(targets.counts, null, 2));
          NODE

      - name: Build production package
        run: |
          chmod +x wien-lod21/run.sh
          /usr/bin/time -v bash wien-lod21/run.sh

      - name: Validate production package
        run: |
          node wien-lod21/validate-production.mjs \
            wien-lod21/build/WienBuildingsLOD21

      - uses: actions/upload-artifact@v7
        with:
          name: wien-lod21-production-roof-wave2
          path: wien-lod21/build/WienBuildingsLOD21/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Commit validated production snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wien-lod21/targets.production.json
          git diff --cached --quiet && exit 0
          git commit -m "Promote Vienna roof replacement wave 2"
          git push
