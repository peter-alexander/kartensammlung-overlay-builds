name: Test Vienna Hybrid-C clipping

on:
  push:
    branches:
      - feature/wien-lod21-hybrid-c-clip-test
    paths:
      - '.github/workflows/wien-lod21-hybrid-c-clip-test.yml'

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WIEN_LOD21_DOWNLOAD_PARALLEL: 6

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y unzip

      - uses: actions/download-artifact@v8
        with:
          name: wien-lod21-citywide-final-analysis
          path: /tmp/lod21-analysis
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35779704000

      - name: Prepare all Hybrid-C targets
        run: |
          node wien-lod21/analyze-hybrid-candidates.mjs \
            --report /tmp/lod21-analysis/wien-lod21-citywide-final.json \
            --output /tmp/hybrid-candidates.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const data = JSON.parse(
          	fs.readFileSync("/tmp/hybrid-candidates.json", "utf8")
          );
          const candidates = (data.candidates || []).filter(
          	(item) => item.hybridTier === "hybrid-c"
          );
          if (candidates.length !== 169) {
          	throw new Error("Expected 169 Hybrid-C candidates, got " + candidates.length);
          }
          const buildings = candidates.map((candidate) => {
          	const owners = candidate.ownerBwGebIds || [];
          	if (owners.length !== 1) {
          		throw new Error(
          			candidate.historicalCode + ": expected exactly one BW_GEB_ID"
          		);
          	}
          	return {
          		name: "Wien LOD2.1 Hybrid-C clip " + candidate.historicalCode,
          		historicalCode: String(candidate.historicalCode),
          		bwGebId: Number(owners[0]),
          		ksIds: candidate.ksIds,
          		sheet: String(candidate.sheet || candidate.lod21Sheet),
          		lng: Number(candidate.lng),
          		lat: Number(candidate.lat),
          		rolloutMode: "hybrid-clip-pilot",
          		expectedHistoricalOutsideM2:
          			Number(Number(candidate.outsideOldAreaM2).toFixed(3)),
          		sourceMetrics: candidate.metrics
          	};
          });
          fs.writeFileSync("/tmp/hybrid-c.json", JSON.stringify({
          	schemaVersion: 1,
          	status: "hybrid-c-clip-test",
          	zoom: 15,
          	extent: 8192,
          	buildings
          }, null, "\t") + "\n");
          console.log(JSON.stringify({
          	targets: buildings.length,
          	sourceSheets: new Set(buildings.map((item) => item.sheet)).size,
          	outsideHistoricalM2: {
          		min: Math.min(...buildings.map((item) => item.expectedHistoricalOutsideM2)),
          		max: Math.max(...buildings.map((item) => item.expectedHistoricalOutsideM2))
          	}
          }, null, 2));
          NODE

      - name: Build all Hybrid-C clipping targets
        env:
          WIEN_LOD21_TARGETS: /tmp/hybrid-c.json
        run: |
          chmod +x wien-lod21/run.sh
          /usr/bin/time -v bash wien-lod21/run.sh

      - name: Audit Hybrid-C clipped meshes
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const root = "wien-lod21/build/WienBuildingsLOD21";
          const release = JSON.parse(fs.readFileSync(root + "/release.json", "utf8"));
          const manifest = JSON.parse(fs.readFileSync(root + "/targets.json", "utf8"));
          const items = manifest.targets || [];
          if (items.length !== 169 || release.counts.targets !== 169) {
          	throw new Error("Expected 169 built Hybrid-C targets.");
          }

          const failures = [];
          const summary = [];
          for (const target of items) {
          	const clip = target.historicalClip;
          	const remainder = target.hybridRemainder;
          	const expectedRemoved = Number(target.expectedHistoricalOutsideM2);
          	const removed = Number(clip?.removedHistoricalAreaM2);
          	const roofCoverage = Number(clip?.minRoofCoverageRatio);
          	const wallCoverage = Number(
          		clip?.geometricWallBoundaryCoverageRatio
          	);
          	const uncoveredBoundaryM = Number(
          		clip?.uncoveredWallBoundaryLengthM
          	);
          	const rawRemainder = Number(remainder?.rawRemainderAreaM2 || 0);
          	const discardedRemainder = Number(
          		remainder?.discardedSliverAreaM2 || 0
          	);
          	const syntheticObjects = Number(remainder?.syntheticObjects || 0);
          	const meaningfulUnbuiltRemainder = syntheticObjects > 0
          		? 0
          		: Math.max(0, rawRemainder - discardedRemainder);

          	const reasons = [];
          	if (
          		!Number.isFinite(expectedRemoved)
          		|| !Number.isFinite(removed)
          		|| Math.abs(removed - expectedRemoved) > 0.05
          	) reasons.push("removed-area");
          	if (!Number.isFinite(roofCoverage) || roofCoverage < 0.995) {
          		reasons.push("roof-coverage");
          	}
          	if (!Number.isFinite(wallCoverage) || wallCoverage < 0.999) {
          		reasons.push("wall-coverage");
          	}
          	if (
          		!Number.isFinite(uncoveredBoundaryM)
          		|| uncoveredBoundaryM > 0.01
          	) reasons.push("uncovered-boundary");
          	if (meaningfulUnbuiltRemainder > 0.01) {
          		reasons.push("remainder");
          	}

          	const row = {
          		historicalCode: target.historicalCode,
          		sourceMetrics: target.sourceMetrics,
          		historicalClip: clip,
          		hybridRemainder: remainder,
          		historicalObjects: target.matches?.length || 0,
          		reasons
          	};
          	summary.push(row);
          	if (reasons.length) failures.push(row);
          }

          summary.sort((a,b) => a.historicalCode.localeCompare(b.historicalCode));
          failures.sort((a,b) => a.historicalCode.localeCompare(b.historicalCode));
          const result = {
          	releaseCounts: release.counts,
          	total: items.length,
          	passed: items.length - failures.length,
          	failed: failures.length,
          	failures,
          	summary
          };
          fs.writeFileSync(
          	"/tmp/hybrid-c-clip-summary.json",
          	JSON.stringify(result, null, "\t") + "\n"
          );
          console.log(JSON.stringify({
          	total: result.total,
          	passed: result.passed,
          	failed: result.failed,
          	failures: failures.map((item) => ({
          		code: item.historicalCode,
          		reasons: item.reasons,
          		oldCoverage: item.sourceMetrics?.oldCoverage,
          		outsideHistoricalM2:
          			item.historicalClip?.removedHistoricalAreaM2,
          		roofCoverage:
          			item.historicalClip?.minRoofCoverageRatio,
          		wallCoverage:
          			item.historicalClip?.geometricWallBoundaryCoverageRatio,
          		uncoveredBoundaryM:
          			item.historicalClip?.uncoveredWallBoundaryLengthM
          	}))
          }, null, 2));
          if (failures.length) {
          	throw new Error(
          		"Hybrid-C clipping audit failed for "
          		+ failures.length + " of " + items.length + " targets."
          	);
          }
          NODE

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wien-lod21-hybrid-c-clip-test
          path: |
            wien-lod21/build/WienBuildingsLOD21/
            /tmp/hybrid-c-clip-summary.json
          if-no-files-found: warn
          retention-days: 5
          compression-level: 6
