name: Build overlay layers

on:
  workflow_dispatch:
    inputs:
      target:
        description: Layer to build
        required: true
        default: all
        type: choice
        options:
          - all
          - rge-analyse
          - radparken
          - sitzmoeglichkeiten
          - radlkarte
          - timezone-boundaries
      build_legacy:
        description: Build legacy output (GeoJSON / PBF tiles directories)
        required: true
        default: true
        type: boolean
  schedule:
    - cron: '0 0 * * *'

concurrency:
  group: overlay-builds
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  node-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Verify Node/npm toolchain and lockfile installability
        run: |
          node -v
          npm -v
          npm ci --dry-run --no-fund --no-audit

  tippecanoe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7

      - name: Restore tippecanoe cache
        id: cache-tippecanoe
        uses: actions/cache@v6
        with:
          path: |
            ${{ github.workspace }}/.local/bin/tippecanoe
            ${{ github.workspace }}/.local/bin/tile-join
          key: ${{ runner.os }}-tippecanoe-${{ hashFiles('.github/scripts/build-tippecanoe.sh', '.github/tippecanoe-version.txt') }}

      - name: Install system dependencies
        if: steps.cache-tippecanoe.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev zlib1g-dev

      - name: Build tippecanoe
        if: steps.cache-tippecanoe.outputs.cache-hit != 'true'
        run: |
          chmod +x .github/scripts/build-tippecanoe.sh
          .github/scripts/build-tippecanoe.sh >/dev/null

      - name: Verify tippecanoe
        run: |
          test -x "${GITHUB_WORKSPACE}/.local/bin/tippecanoe"
          "${GITHUB_WORKSPACE}/.local/bin/tippecanoe" --version || true

      - name: Upload tippecanoe artifact
        id: artifact
        uses: actions/upload-artifact@v7
        with:
          name: tippecanoe-bin
          path: |
            ${{ github.workspace }}/.local/bin/tippecanoe
            ${{ github.workspace }}/.local/bin/tile-join
          if-no-files-found: error

  rge-analyse:
    needs: [tippecanoe, node-health]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'rge-analyse' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    env:
      BUILD_LEGACY: ${{ github.event_name != 'workflow_dispatch' || inputs.build_legacy }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev zlib1g-dev

      - name: Download tippecanoe artifact
        uses: actions/download-artifact@v8
        with:
          name: tippecanoe-bin
          path: ${{ github.workspace }}/.local/bin

      - name: Make tippecanoe executable
        run: |
          chmod +x "${GITHUB_WORKSPACE}/.local/bin/tippecanoe"
          if [ -f "${GITHUB_WORKSPACE}/.local/bin/tile-join" ]; then
            chmod +x "${GITHUB_WORKSPACE}/.local/bin/tile-join"
          fi

      - name: Install npm dependencies
        run: npm ci --no-fund --no-audit

      - name: Build RgE-Analyse
        env:
          PATH: ${{ github.workspace }}/.local/bin:${{ env.PATH }}
        run: |
          /usr/bin/time -v node rge-analyse/build.mjs

      - name: Upload build artifact
        id: artifact
        uses: actions/upload-artifact@v7
        with:
          name: rge-analyse-build
          path: rge-analyse/build/
          if-no-files-found: error

  radparken:
    needs: [tippecanoe, node-health]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'radparken' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    env:
      BUILD_LEGACY: ${{ github.event_name != 'workflow_dispatch' || inputs.build_legacy }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev zlib1g-dev

      - name: Download tippecanoe artifact
        uses: actions/download-artifact@v8
        with:
          name: tippecanoe-bin
          path: ${{ github.workspace }}/.local/bin

      - name: Make tippecanoe executable
        run: |
          chmod +x "${GITHUB_WORKSPACE}/.local/bin/tippecanoe"
          if [ -f "${GITHUB_WORKSPACE}/.local/bin/tile-join" ]; then
            chmod +x "${GITHUB_WORKSPACE}/.local/bin/tile-join"
          fi

      - name: Install npm dependencies
        run: npm ci --no-fund --no-audit

      - name: Build Radparken
        env:
          TIPPECANOE_BIN: ${{ github.workspace }}/.local/bin/tippecanoe
          BUILD_PMTILES: true
          BUILD_PBF_TILES: ${{ env.BUILD_LEGACY }}
        run: |
          chmod +x radparken/run.sh
          /usr/bin/time -v bash radparken/run.sh

      - name: Upload build artifact
        id: artifact
        uses: actions/upload-artifact@v7
        with:
          name: radparken-build
          path: radparken/build/
          if-no-files-found: error

  sitzmoeglichkeiten:
    needs: [tippecanoe, node-health]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'sitzmoeglichkeiten' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    env:
      BUILD_LEGACY: ${{ github.event_name != 'workflow_dispatch' || inputs.build_legacy }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev zlib1g-dev

      - name: Download tippecanoe artifact
        uses: actions/download-artifact@v8
        with:
          name: tippecanoe-bin
          path: ${{ github.workspace }}/.local/bin

      - name: Make tippecanoe executable
        run: |
          chmod +x "${GITHUB_WORKSPACE}/.local/bin/tippecanoe"
          if [ -f "${GITHUB_WORKSPACE}/.local/bin/tile-join" ]; then
            chmod +x "${GITHUB_WORKSPACE}/.local/bin/tile-join"
          fi

      - name: Install npm dependencies
        run: npm ci --no-fund --no-audit

      - name: Build Sitzmoeglichkeiten
        env:
          TIPPECANOE_BIN: ${{ github.workspace }}/.local/bin/tippecanoe
          BUILD_PMTILES: true
          BUILD_PBF_TILES: ${{ env.BUILD_LEGACY }}
        run: |
          chmod +x sitzmoeglichkeiten/run.sh
          /usr/bin/time -v bash sitzmoeglichkeiten/run.sh

      - name: Upload build artifact
        id: artifact
        uses: actions/upload-artifact@v7
        with:
          name: sitzmoeglichkeiten-build
          path: sitzmoeglichkeiten/out/
          if-no-files-found: error

  radlkarte:
    needs: [tippecanoe, node-health]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'radlkarte' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev zlib1g-dev

      - name: Download tippecanoe artifact
        uses: actions/download-artifact@v8
        with:
          name: tippecanoe-bin
          path: ${{ github.workspace }}/.local/bin

      - name: Make tippecanoe executable
        run: |
          chmod +x "${GITHUB_WORKSPACE}/.local/bin/tippecanoe"
          if [ -f "${GITHUB_WORKSPACE}/.local/bin/tile-join" ]; then
            chmod +x "${GITHUB_WORKSPACE}/.local/bin/tile-join"
          fi

      - name: Build Radlkarte
        env:
          TIPPECANOE_BIN: ${{ github.workspace }}/.local/bin/tippecanoe
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x radlkarte/run.sh
          /usr/bin/time -v bash radlkarte/run.sh

      - name: Upload build artifact
        id: artifact
        uses: actions/upload-artifact@v7
        with:
          name: radlkarte-build
          path: radlkarte/build/Radlkarte/
          if-no-files-found: error

  timezone-boundaries:
    needs: [tippecanoe, node-health]
    if: ${{ always() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'timezone-boundaries') && needs.tippecanoe.result == 'success' && needs.node-health.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Restore timezone boundary cache
        uses: actions/cache@v6
        with:
          path: |
            timezone-boundaries/input/
            timezone-boundaries/build/TimezoneBoundaries/
          key: ${{ runner.os }}-timezone-boundaries-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-timezone-boundaries-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev zlib1g-dev unzip

      - name: Download tippecanoe artifact
        uses: actions/download-artifact@v8
        with:
          name: tippecanoe-bin
          path: ${{ github.workspace }}/.local/bin

      - name: Make tippecanoe executable
        run: |
          chmod +x "${GITHUB_WORKSPACE}/.local/bin/tippecanoe"
          if [ -f "${GITHUB_WORKSPACE}/.local/bin/tile-join" ]; then
            chmod +x "${GITHUB_WORKSPACE}/.local/bin/tile-join"
          fi

      - name: Build Timezone Boundaries
        env:
          TIPPECANOE_BIN: ${{ github.workspace }}/.local/bin/tippecanoe
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x timezone-boundaries/run.sh
          /usr/bin/time -v bash timezone-boundaries/run.sh

      - name: Upload build artifact
        id: artifact
        uses: actions/upload-artifact@v7
        with:
          name: timezone-boundaries-build
          path: timezone-boundaries/build/TimezoneBoundaries/
          if-no-files-found: error

  deploy:
    needs: [tippecanoe, rge-analyse, radparken, sitzmoeglichkeiten, radlkarte, timezone-boundaries]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'all' }}
      BUILD_LEGACY: ${{ github.event_name != 'workflow_dispatch' || inputs.build_legacy }}
      REMOTE_ROOT: ${{ vars.EASYNAME_REMOTE_ROOT }}
      EASYNAME_FTP_HOST: ${{ secrets.EASYNAME_FTP_HOST }}
      EASYNAME_FTP_USER: ${{ secrets.EASYNAME_FTP_USER }}
      EASYNAME_FTP_PASSWORD: ${{ secrets.EASYNAME_FTP_PASSWORD }}
      MAIN_SERVER: ${{ secrets.MAIN_SERVER }}
      LFTP_PARALLEL: 6
      RGE_ANALYSE_READY: ${{ needs.rge-analyse.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'rge-analyse') }}
      RADPARKEN_READY: ${{ needs.radparken.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'radparken') }}
      SITZMOEGLICHKEITEN_READY: ${{ needs.sitzmoeglichkeiten.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'sitzmoeglichkeiten') }}
      RADLKARTE_READY: ${{ needs.radlkarte.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'radlkarte') }}
      TIMEZONE_BOUNDARIES_READY: ${{ needs.timezone-boundaries.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'timezone-boundaries') }}
    steps:
      - uses: actions/checkout@v7

      - name: Summarize selected build jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          target = os.environ["TARGET"]
          needs = json.loads(os.environ["NEEDS_JSON"])
          all_targets = ["rge-analyse", "radparken", "sitzmoeglichkeiten", "radlkarte", "timezone-boundaries"]
          required_targets = all_targets if target == "all" else [target]

          succeeded = []
          skipped = []
          for job in required_targets:
            result = needs.get(job, {}).get("result")
            if result == "success":
              succeeded.append(job)
            else:
              skipped.append(f"{job}: {result}")

          if succeeded:
            print("Build artifacts available for deploy:", ", ".join(succeeded))
          else:
            print("No selected build artifacts are available for deploy.")

          if skipped:
            print("Skipped deploy for unsuccessful or skipped builds:")
            for item in skipped:
              print(f"- {item}")
          PY

      - name: Install deploy dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Download RgE-Analyse artifact
        if: ${{ env.RGE_ANALYSE_READY == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: rge-analyse-build
          path: deploy/rge-analyse

      - name: Download Radparken artifact
        if: ${{ env.RADPARKEN_READY == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: radparken-build
          path: deploy/radparken

      - name: Download Sitzmoeglichkeiten artifact
        if: ${{ env.SITZMOEGLICHKEITEN_READY == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: sitzmoeglichkeiten-build
          path: deploy/sitzmoeglichkeiten

      - name: Download Radlkarte artifact
        if: ${{ env.RADLKARTE_READY == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: radlkarte-build
          path: deploy/radlkarte

      - name: Download Timezone Boundaries artifact
        if: ${{ env.TIMEZONE_BOUNDARIES_READY == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: timezone-boundaries-build
          path: deploy/timezone-boundaries

      - name: Deploy RgE-Analyse
        if: ${{ env.RGE_ANALYSE_READY == 'true' }}
        run: |
          chmod +x .github/scripts/lftp-upload.sh
          REMOTE_BASE="${REMOTE_ROOT:+$REMOTE_ROOT/}RgE-Analyse"

          .github/scripts/lftp-upload.sh deploy/rge-analyse/rge_analyse.pmtiles "$REMOTE_BASE/rge_analyse.pmtiles"

          if [ "$BUILD_LEGACY" = "true" ]; then
            .github/scripts/lftp-upload.sh deploy/rge-analyse/rge_analyse.geojson "$REMOTE_BASE/rge_analyse.geojson"
          fi

          curl -fsS --retry 3 --retry-delay 10 -o /dev/null "$MAIN_SERVER/updatedRgeAnalyse.php?date=$(date +%s)"

      - name: Deploy Radparken
        if: ${{ env.RADPARKEN_READY == 'true' }}
        run: |
          chmod +x .github/scripts/lftp-upload.sh
          REMOTE_BASE="${REMOTE_ROOT:+$REMOTE_ROOT/}Radparken"

          .github/scripts/lftp-upload.sh deploy/radparken/radparken.pmtiles "$REMOTE_BASE/radparken.pmtiles"

          if [ "$BUILD_LEGACY" = "true" ]; then
            .github/scripts/lftp-upload.sh deploy/radparken/tiles "$REMOTE_BASE/tiles"
          fi

          curl -fsS --retry 3 --retry-delay 10 -o /dev/null "$MAIN_SERVER/updatedRadparken.php?date=$(date +%s)"

      - name: Deploy Sitzmoeglichkeiten
        if: ${{ env.SITZMOEGLICHKEITEN_READY == 'true' }}
        run: |
          chmod +x .github/scripts/lftp-upload.sh
          REMOTE_BASE="${REMOTE_ROOT:+$REMOTE_ROOT/}Sitzmoeglichkeiten"

          .github/scripts/lftp-upload.sh deploy/sitzmoeglichkeiten/wien-sitzdistanz.pmtiles "$REMOTE_BASE/wien-sitzdistanz.pmtiles"

          if [ "$BUILD_LEGACY" = "true" ]; then
            .github/scripts/lftp-upload.sh deploy/sitzmoeglichkeiten/tiles "$REMOTE_BASE/tiles"
          fi

          curl -fsS --retry 3 --retry-delay 10 -o /dev/null "$MAIN_SERVER/updatedSitzmoeglichkeiten.php?date=$(date +%s)"

      - name: Deploy Radlkarte
        if: ${{ env.RADLKARTE_READY == 'true' }}
        run: |
          chmod +x .github/scripts/lftp-upload.sh
          REMOTE_BASE="${REMOTE_ROOT:+$REMOTE_ROOT/}Radlkarte"

          .github/scripts/lftp-upload.sh deploy/radlkarte/radlkarte.pmtiles "$REMOTE_BASE/radlkarte.pmtiles"

          curl -fsS --retry 3 --retry-delay 10 -o /dev/null "$MAIN_SERVER/updatedRadlkarte.php?date=$(date +%s)"

      - name: Deploy Timezone Boundaries
        if: ${{ env.TIMEZONE_BOUNDARIES_READY == 'true' }}
        run: |
          chmod +x .github/scripts/lftp-upload.sh
          REMOTE_BASE="${REMOTE_ROOT:+$REMOTE_ROOT/}Zeitzonen"

          .github/scripts/lftp-upload.sh deploy/timezone-boundaries/timezone-boundaries.pmtiles "$REMOTE_BASE/timezone-boundaries.pmtiles"
          .github/scripts/lftp-upload.sh deploy/timezone-boundaries/release.json "$REMOTE_BASE/release.json"

      - name: Delete temporary artifacts after successful deploy
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          TIPPECANOE_ARTIFACT_ID: ${{ needs.tippecanoe.outputs.artifact_id }}
          RGE_ANALYSE_ARTIFACT_ID: ${{ needs.rge-analyse.outputs.artifact_id }}
          RADPARKEN_ARTIFACT_ID: ${{ needs.radparken.outputs.artifact_id }}
          SITZMOEGLICHKEITEN_ARTIFACT_ID: ${{ needs.sitzmoeglichkeiten.outputs.artifact_id }}
          RADLKARTE_ARTIFACT_ID: ${{ needs.radlkarte.outputs.artifact_id }}
          TIMEZONE_BOUNDARIES_ARTIFACT_ID: ${{ needs.timezone-boundaries.outputs.artifact_id }}
        run: |
          for ARTIFACT_ID in \
            "$TIPPECANOE_ARTIFACT_ID" \
            "$RGE_ANALYSE_ARTIFACT_ID" \
            "$RADPARKEN_ARTIFACT_ID" \
            "$SITZMOEGLICHKEITEN_ARTIFACT_ID" \
            "$RADLKARTE_ARTIFACT_ID" \
            "$TIMEZONE_BOUNDARIES_ARTIFACT_ID"
          do
            if [ -n "$ARTIFACT_ID" ]; then
              gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}"
            fi
          done
