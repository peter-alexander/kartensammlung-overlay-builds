name: Summarize Vienna clipping set

on:
  push:
    branches:
      - feature/wien-lod21-clip-pilot
    paths:
      - '.github/workflows/wien-lod21-clip-seven-summary.yml'

permissions:
  contents: write
  actions: read

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: wien-lod21-clip-seven
          path: /tmp/clip-seven
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35853874504

      - name: Commit compact seven-case summary
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";

          function findFile(root, name) {
          	for (const entry of fs.readdirSync(root, { withFileTypes: true })) {
          		const full = path.join(root, entry.name);
          		if (entry.isDirectory()) {
          			const found = findFile(full, name);
          			if (found) return found;
          		} else if (entry.name === name) {
          			return full;
          		}
          	}
          	return "";
          }

          const targetsPath = findFile("/tmp/clip-seven", "targets.json");
          const releasePath = findFile("/tmp/clip-seven", "release.json");
          if (!targetsPath || !releasePath) throw new Error("Clip artifact manifests missing.");
          const targets = JSON.parse(fs.readFileSync(targetsPath, "utf8"));
          const release = JSON.parse(fs.readFileSync(releasePath, "utf8"));
          const summary = {
          	releaseCounts: release.counts,
          	summary: (targets.targets || []).map((target) => ({
          		historicalCode: target.historicalCode,
          		expectedHistoricalOutsideM2: target.expectedHistoricalOutsideM2,
          		historicalClip: target.historicalClip,
          		hybridRemainder: target.hybridRemainder,
          		historicalObjects: target.matches?.length || 0
          	})).sort((a,b) => a.historicalCode.localeCompare(b.historicalCode))
          };
          fs.writeFileSync(
          	"wien-lod21/clip-seven.generated.json",
          	JSON.stringify(summary, null, "\t") + "\n"
          );
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wien-lod21/clip-seven.generated.json
          git commit -m "Record Vienna seven-case clipping metrics"
          git push
