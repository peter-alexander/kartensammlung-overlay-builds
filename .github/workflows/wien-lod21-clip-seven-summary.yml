name: Summarize Vienna clipping set

on:
  push:
    branches:
      - feature/wien-lod21-clip-pilot
    paths:
      - '.github/workflows/wien-lod21-clip-seven-summary.yml'

permissions:
  contents: write
  actions: read

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: wien-lod21-clip-seven
          path: /tmp/clip-seven
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35852859554

      - name: Commit compact seven-case summary
        run: |
          cp /tmp/clip-seven/clip-seven-summary.json \
            wien-lod21/clip-seven.generated.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wien-lod21/clip-seven.generated.json
          git commit -m "Record Vienna seven-case clipping metrics"
          git push
