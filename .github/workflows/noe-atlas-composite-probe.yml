name: Probe NÖ Atlas composite layers
on:
  pull_request:
    paths:
      - 'server-catalogs/noe-atlas-composite-probe.mjs'
      - '.github/workflows/noe-atlas-composite-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
      - run: node server-catalogs/noe-atlas-composite-probe.mjs
