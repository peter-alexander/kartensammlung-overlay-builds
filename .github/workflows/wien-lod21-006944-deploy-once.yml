name: Deploy Vienna LOD2.1 006944 once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/wien-lod21-006944-deploy-once.yml"

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REMOTE_ROOT: ${{ vars.EASYNAME_REMOTE_ROOT }}
      EASYNAME_FTP_HOST: ${{ secrets.EASYNAME_FTP_HOST }}
      EASYNAME_FTP_USER: ${{ secrets.EASYNAME_FTP_USER }}
      EASYNAME_FTP_PASSWORD: ${{ secrets.EASYNAME_FTP_PASSWORD }}
      EXPECTED_GENERATED_AT: "2026-09-24T21:02:04.559Z"
      ARTIFACT_RUN_ID: "36057202923"
      ARTIFACT_NAME: "wien-lod21-006944-production"

    steps:
      - uses: actions/checkout@v7

      - name: Download validated production artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: /tmp/wien-lod21-006944-production
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.ARTIFACT_RUN_ID }}

      - name: Verify validated artifact
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const root = "/tmp/wien-lod21-006944-production";
          const release = JSON.parse(fs.readFileSync(root + "/release.json", "utf8"));
          const targets = JSON.parse(fs.readFileSync(root + "/targets.json", "utf8"));
          const target = targets.targets.find(
          	(item) => String(item.historicalCode) === "006944"
          );

          if (release.generatedAt !== process.env.EXPECTED_GENERATED_AT) {
          	throw new Error(
          		"Unexpected generatedAt: " + release.generatedAt
          	);
          }
          if (
          	Number(release.counts?.targets) !== 2310
          	|| Number(release.counts?.hybridEaveClip) !== 27
          	|| Number(release.counts?.maptoolkitRoofReplacement) !== 36
          ) {
          	throw new Error(
          		"Unexpected release counts: " + JSON.stringify(release.counts)
          	);
          }
          if (
          	!target
          	|| target.rolloutMode !== "hybrid-eave-clip"
          	|| Number(target.bwGebId) !== 5288572
          	|| Number(target.historicalClip?.minRoofCoverageRatio) !== 1
          	|| Number(target.historicalClip?.geometricWallBoundaryCoverageRatio) !== 1
          	|| Number(target.historicalClip?.uncoveredWallBoundaryLengthM) !== 0
          ) {
          	throw new Error(
          		"Validated 006944 target is missing or changed: "
          		+ JSON.stringify(target)
          	);
          }

          const tile = root + "/tiles/15/17874/11363.bin";
          if (!fs.existsSync(tile) || fs.statSync(tile).size < 1) {
          	throw new Error("Validated 006944 tile is missing.");
          }
          console.log("Validated artifact OK:", release.generatedAt);
          NODE

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy validated Vienna LOD2.1 artifact
        run: |
          chmod +x .github/scripts/lftp-upload.sh
          REMOTE_BASE="${REMOTE_ROOT:+$REMOTE_ROOT/}WienLOD21"
          .github/scripts/lftp-upload.sh           	/tmp/wien-lod21-006944-production           	"$REMOTE_BASE"

      - name: Verify live release and target tile
        run: |
          set -euo pipefail
          LOCAL_TILE="/tmp/wien-lod21-006944-production/tiles/15/17874/11363.bin"
          LOCAL_SHA="$(sha256sum "$LOCAL_TILE" | awk '{print $1}')"

          for attempt in 1 2 3 4 5 6; do
          	CACHE_BUST="${GITHUB_SHA}-${attempt}-$(date +%s)"
          	if curl --fail --silent --show-error --location           		"https://tiles.radlobby.at/WienLOD21/release.json?verify=${CACHE_BUST}"           		-o /tmp/live-release.json           		&& curl --fail --silent --show-error --location           		"https://tiles.radlobby.at/WienLOD21/tiles/15/17874/11363.bin?verify=${CACHE_BUST}"           		-o /tmp/live-006944.bin
          	then
          		if EXPECTED_GENERATED_AT="$EXPECTED_GENERATED_AT" node --input-type=module <<'NODE'
          import fs from "node:fs";
          const release = JSON.parse(fs.readFileSync("/tmp/live-release.json", "utf8"));
          if (
          	release.generatedAt !== process.env.EXPECTED_GENERATED_AT
          	|| Number(release.counts?.targets) !== 2310
          	|| Number(release.counts?.hybridEaveClip) !== 27
          	|| Number(release.counts?.maptoolkitRoofReplacement) !== 36
          ) process.exit(1);
          NODE
          		then
          			REMOTE_SHA="$(sha256sum /tmp/live-006944.bin | awk '{print $1}')"
          			if [ "$REMOTE_SHA" = "$LOCAL_SHA" ]; then
          				echo "Live Vienna LOD2.1 release and 006944 tile verified."
          				exit 0
          			fi
          		fi
          	fi
          	sleep 5
          done

          echo "Live verification failed." >&2
          exit 1
