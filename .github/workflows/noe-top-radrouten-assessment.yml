name: Verify NÖ Top-Radrouten source overlap
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server-catalogs/noe-top-radrouten-assessment.mjs'
      - '.github/workflows/noe-top-radrouten-assessment.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
      - run: node server-catalogs/noe-top-radrouten-assessment.mjs
