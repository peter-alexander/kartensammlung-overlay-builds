name: Deploy validated Vienna Hybrid-B clip package

on:
  push:
    branches:
      - feature/wien-lod21-clip-pilot
    paths:
      - '.github/workflows/wien-lod21-clip-deploy.yml'

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REMOTE_ROOT: ${{ vars.EASYNAME_REMOTE_ROOT }}
      EASYNAME_FTP_HOST: ${{ secrets.EASYNAME_FTP_HOST }}
      EASYNAME_FTP_USER: ${{ secrets.EASYNAME_FTP_USER }}
      EASYNAME_FTP_PASSWORD: ${{ secrets.EASYNAME_FTP_PASSWORD }}
      LFTP_PARALLEL: 6

    steps:
      - uses: actions/checkout@v7

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - uses: actions/download-artifact@v8
        with:
          name: wien-lod21-production-hybrid-b-clip
          path: /tmp/WienBuildingsLOD21
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35855522506

      - name: Verify exact validated artifact
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const release = JSON.parse(
          	fs.readFileSync("/tmp/WienBuildingsLOD21/release.json", "utf8")
          );
          const targets = JSON.parse(
          	fs.readFileSync("/tmp/WienBuildingsLOD21/targets.json", "utf8")
          );
          if (release.status !== "production") throw new Error("Not production.");
          if (release.counts.targets !== 1907) throw new Error("Expected 1907 targets.");
          if (release.counts.hybridA !== 614) throw new Error("Expected 614 Hybrid-A.");
          if (release.counts.hybridBAbsolute !== 72) {
          	throw new Error("Expected 72 Hybrid-B absolute.");
          }
          if (release.counts.hybridBThin !== 3) {
          	throw new Error("Expected 3 Hybrid-B thin.");
          }
          if (release.counts.hybridBClip !== 7) {
          	throw new Error("Expected 7 Hybrid-B clip.");
          }
          const items = targets.targets || [];
          if (items.length !== 1907) throw new Error("Expected 1907 manifest targets.");
          const clip = items.filter((item) => item.rolloutMode === "hybrid-b-clip");
          if (clip.length !== 7) throw new Error("Expected seven clip targets.");
          for (const item of clip) {
          	if (Number(item.historicalClip?.uncoveredWallBoundaryLengthM) > 0.01) {
          		throw new Error(item.historicalCode + ": uncovered wall boundary");
          	}
          	if (
          		Number(item.historicalClip?.geometricWallBoundaryCoverageRatio)
          		< 0.999
          	) {
          		throw new Error(item.historicalCode + ": wall coverage incomplete");
          	}
          }
          console.log(JSON.stringify({
          	counts: release.counts,
          	clip: clip.map((item) => ({
          		code: item.historicalCode,
          		removedHistoricalAreaM2:
          			item.historicalClip?.removedHistoricalAreaM2,
          		uncoveredWallBoundaryLengthM:
          			item.historicalClip?.uncoveredWallBoundaryLengthM
          	}))
          }, null, 2));
          NODE

      - name: Deploy exact validated artifact
        run: |
          chmod +x .github/scripts/lftp-upload.sh
          REMOTE_BASE="${REMOTE_ROOT:+$REMOTE_ROOT/}WienLOD21"
          .github/scripts/lftp-upload.sh /tmp/WienBuildingsLOD21 "$REMOTE_BASE"
