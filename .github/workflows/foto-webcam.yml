name: Refresh Foto-Webcam data

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'foto-webcam/**'
      - '.github/scripts/main-ftp-upload-file.sh'
      - '.github/workflows/foto-webcam.yml'
  push:
    branches:
      - main
    paths:
      - 'foto-webcam/**'
      - '.github/scripts/main-ftp-upload-file.sh'
      - '.github/workflows/foto-webcam.yml'
  schedule:
    - cron: '29 4 * * *'

concurrency:
  group: foto-webcam
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MAIN_FTP_HOST: ${{ secrets.MAIN_FTP_HOST }}
      MAIN_FTP_USER: ${{ secrets.MAIN_FTP_USER }}
      MAIN_FTP_PASSWORD: ${{ secrets.MAIN_FTP_PASSWORD }}
      MAIN_REMOTE_ROOT: ${{ vars.MAIN_REMOTE_ROOT }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Build Foto-Webcam GeoJSON
        run: node foto-webcam/build.mjs

      - name: Deploy GeoJSON to Lima
        if: github.event_name != 'pull_request'
        run: |
          test -n "$MAIN_REMOTE_ROOT"
          chmod +x .github/scripts/main-ftp-upload-file.sh
          .github/scripts/main-ftp-upload-file.sh \
            foto-webcam/build/FotoWebcam.geojson \
            "${MAIN_REMOTE_ROOT%/}/FotoWebcam.geojson"
