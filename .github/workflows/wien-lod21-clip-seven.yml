name: Test Vienna LOD2.1 clipping set

on:
  push:
    branches:
      - feature/wien-lod21-clip-pilot
    paths:
      - '.github/workflows/wien-lod21-clip-seven.yml'
      - 'wien-lod21/build.mjs'

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WIEN_LOD21_DOWNLOAD_PARALLEL: 6

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y unzip

      - uses: actions/download-artifact@v8
        with:
          name: wien-lod21-citywide-final-analysis
          path: /tmp/lod21-analysis
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35779704000

      - name: Prepare seven clipping targets
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const wanted = new Set([
          	"011758", "032459", "045503", "047031",
          	"061091", "065479", "088729"
          ]);
          const report = JSON.parse(
          	fs.readFileSync("/tmp/lod21-analysis/wien-lod21-citywide-final.json", "utf8")
          );
          const candidates = (report.hybridCandidates || []).filter(
          	(item) => wanted.has(String(item.historicalCode))
          );
          if (candidates.length !== 7) {
          	throw new Error("Expected seven candidates, got " + candidates.length);
          }
          const buildings = candidates.map((candidate) => {
          	const owners = candidate.ownerBwGebIds || [];
          	if (owners.length !== 1) {
          		throw new Error(candidate.historicalCode + ": expected one owner");
          	}
          	const oldArea = Number(candidate.metrics?.oldArea);
          	const intersectionArea = Number(candidate.metrics?.intersectionArea);
          	return {
          		name: "Wien LOD2.1 clip " + candidate.historicalCode,
          		historicalCode: String(candidate.historicalCode),
          		bwGebId: Number(owners[0]),
          		ksIds: candidate.ksIds,
          		sheet: String(candidate.sheet || candidate.lod21Sheet),
          		lng: Number(candidate.lng),
          		lat: Number(candidate.lat),
          		rolloutMode: "hybrid-clip-pilot",
          		expectedHistoricalOutsideM2:
          			Number((oldArea - intersectionArea).toFixed(3))
          	};
          });
          fs.writeFileSync("/tmp/clip-seven.json", JSON.stringify({
          	schemaVersion: 1,
          	status: "clip-seven-test",
          	zoom: 15,
          	extent: 8192,
          	buildings
          }, null, "\t") + "\n");
          console.log(JSON.stringify(buildings, null, 2));
          NODE

      - name: Build clipping set
        env:
          WIEN_LOD21_TARGETS: /tmp/clip-seven.json
        run: |
          chmod +x wien-lod21/run.sh
          /usr/bin/time -v bash wien-lod21/run.sh

      - name: Validate all clipped meshes
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const root = "wien-lod21/build/WienBuildingsLOD21";
          const release = JSON.parse(fs.readFileSync(root + "/release.json", "utf8"));
          const manifest = JSON.parse(fs.readFileSync(root + "/targets.json", "utf8"));
          const items = manifest.targets || [];
          if (items.length !== 7 || release.counts.targets !== 7) {
          	throw new Error("Expected seven clipping targets.");
          }

          const summary = [];
          for (const target of items) {
          	const clip = target.historicalClip;
          	if (!clip) throw new Error(target.historicalCode + ": clip stats missing");
          	const expected = Number(target.expectedHistoricalOutsideM2);
          	const removed = Number(clip.removedHistoricalAreaM2);
          	if (!Number.isFinite(expected) || Math.abs(removed - expected) > 0.05) {
          		throw new Error(
          			target.historicalCode
          			+ ": removed area mismatch " + removed + " vs " + expected
          		);
          	}
          	if (!(clip.minRoofCoverageRatio >= 0.995)) {
          		throw new Error(
          			target.historicalCode
          			+ ": roof coverage " + clip.minRoofCoverageRatio
          		);
          	}
          	if (!(clip.geometricWallBoundaryCoverageRatio >= 0.999)) {
          		throw new Error(
          			target.historicalCode
          			+ ": geometric wall coverage "
          			+ clip.geometricWallBoundaryCoverageRatio
          			+ " (uncovered "
          			+ clip.uncoveredWallBoundaryLengthM + " m)"
          		);
          	}
          	if (!(clip.generatedWallSurfaces > 0 && clip.clippedRoofSurfaces > 0)) {
          		throw new Error(target.historicalCode + ": empty clipped mesh");
          	}
          	const remainder = target.hybridRemainder;
          	if (!remainder) throw new Error(target.historicalCode + ": remainder missing");
          	const raw = Number(remainder.rawRemainderAreaM2 || 0);
          	const discarded = Number(remainder.discardedSliverAreaM2 || 0);
          	if (
          		Number(remainder.syntheticObjects || 0) <= 0
          		&& Math.max(0, raw - discarded) > 0.01
          	) {
          		throw new Error(target.historicalCode + ": meaningful remainder missing");
          	}
          	summary.push({
          		historicalCode: target.historicalCode,
          		expectedHistoricalOutsideM2: expected,
          		historicalClip: clip,
          		hybridRemainder: remainder,
          		historicalObjects: target.matches?.length || 0
          	});
          }
          summary.sort((a,b) => a.historicalCode.localeCompare(b.historicalCode));
          fs.writeFileSync(
          	"/tmp/clip-seven-summary.json",
          	JSON.stringify({
          		releaseCounts: release.counts,
          		summary
          	}, null, "\t") + "\n"
          );
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wien-lod21-clip-seven
          path: |
            wien-lod21/build/WienBuildingsLOD21/
            /tmp/clip-seven-summary.json
          if-no-files-found: warn
          retention-days: 3
