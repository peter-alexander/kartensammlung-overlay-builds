name: Build Overture admin

on:
  workflow_dispatch:
    inputs:
      overture_release:
        description: Overture release (for example 2026-08-19.0) or latest
        required: true
        default: latest
        type: string
      boundary_maxzoom:
        description: Boundary PMTiles maximum zoom
        required: true
        default: '14'
        type: string
      area_maxzoom:
        description: Interactive area PMTiles maximum zoom
        required: true
        default: '11'
        type: string
  pull_request:
    paths:
      - 'overture-admin/**'
      - '.github/scripts/build-tippecanoe.sh'
      - '.github/tippecanoe-version.txt'
      - '.github/scripts/lftp-upload.sh'
      - '.github/workflows/overture-admin.yml'
  push:
    branches:
      - main
    paths:
      - 'overture-admin/**'
      - '.github/scripts/build-tippecanoe.sh'
      - '.github/tippecanoe-version.txt'
      - '.github/scripts/lftp-upload.sh'
      - '.github/workflows/overture-admin.yml'
  schedule:
    - cron: '17 4 28 * *'

permissions:
  contents: read

concurrency:
  group: overture-admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OVERTURE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.overture_release || 'latest' }}
      BOUNDARY_MAXZOOM: ${{ github.event_name == 'workflow_dispatch' && inputs.boundary_maxzoom || '14' }}
      AREA_MAXZOOM: ${{ github.event_name == 'workflow_dispatch' && inputs.area_maxzoom || '11' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: overture-admin/requirements.txt

      - name: Restore tippecanoe cache
        id: cache-tippecanoe
        uses: actions/cache@v6
        with:
          path: |
            ${{ github.workspace }}/.local/bin/tippecanoe
            ${{ github.workspace }}/.local/bin/tile-join
          key: ${{ runner.os }}-tippecanoe-${{ hashFiles('.github/scripts/build-tippecanoe.sh', '.github/tippecanoe-version.txt') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev zlib1g-dev

      - name: Build tippecanoe
        if: steps.cache-tippecanoe.outputs.cache-hit != 'true'
        run: |
          chmod +x .github/scripts/build-tippecanoe.sh
          .github/scripts/build-tippecanoe.sh >/dev/null

      - name: Verify tippecanoe
        run: |
          test -x "${GITHUB_WORKSPACE}/.local/bin/tippecanoe"
          "${GITHUB_WORKSPACE}/.local/bin/tippecanoe" --version || true

      - name: Install Python dependencies
        run: |
          python -m pip install --requirement overture-admin/requirements.txt

      - name: Build Overture admin PMTiles
        env:
          TIPPECANOE_BIN: ${{ github.workspace }}/.local/bin/tippecanoe
        run: |
          /usr/bin/time -v python overture-admin/build_split.py \
            --release "${OVERTURE_RELEASE}" \
            --boundary-maxzoom "${BOUNDARY_MAXZOOM}" \
            --area-maxzoom "${AREA_MAXZOOM}" \
            --tippecanoe "${TIPPECANOE_BIN}"

      - name: Show audit and output sizes
        run: |
          cat overture-admin/build/OvertureAdmin/audit.json
          cat overture-admin/build/OvertureAdmin/release.json
          du -h overture-admin/build/OvertureAdmin/*

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: overture-admin-build
          path: overture-admin/build/OvertureAdmin/
          if-no-files-found: error
          retention-days: 30

      - name: Install deploy dependency
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          sudo apt-get install -y lftp

      - name: Deploy Overture admin
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          REMOTE_ROOT: ${{ vars.EASYNAME_REMOTE_ROOT }}
          EASYNAME_FTP_HOST: ${{ secrets.EASYNAME_FTP_HOST }}
          EASYNAME_FTP_USER: ${{ secrets.EASYNAME_FTP_USER }}
          EASYNAME_FTP_PASSWORD: ${{ secrets.EASYNAME_FTP_PASSWORD }}
        run: |
          chmod +x .github/scripts/lftp-upload.sh
          REMOTE_BASE="${REMOTE_ROOT:+$REMOTE_ROOT/}OvertureAdmin"

          .github/scripts/lftp-upload.sh \
            overture-admin/build/OvertureAdmin/overture-admin-boundary.pmtiles \
            "$REMOTE_BASE/overture-admin-boundary.pmtiles"
          .github/scripts/lftp-upload.sh \
            overture-admin/build/OvertureAdmin/overture-admin-area.pmtiles \
            "$REMOTE_BASE/overture-admin-area.pmtiles"
          .github/scripts/lftp-upload.sh \
            overture-admin/build/OvertureAdmin/release.json \
            "$REMOTE_BASE/release.json"
          .github/scripts/lftp-upload.sh \
            overture-admin/build/OvertureAdmin/audit.json \
            "$REMOTE_BASE/audit.json"
