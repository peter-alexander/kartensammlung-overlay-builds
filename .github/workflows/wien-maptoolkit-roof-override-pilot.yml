name: Audit Maptoolkit roof override pilot

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --package-lock=false @mapbox/vector-tile pbf

      - uses: actions/download-artifact@v8
        with:
          name: wien-maptoolkit-roof-loss-lod21-analysis
          path: /tmp/roof-loss
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35913353237

      - name: Audit 27 super-safe override targets
        run: |
          node wien-buildings/analyze-maptoolkit-override-pilot.mjs \
            /tmp/roof-loss/wien-roof-loss-summary.json \
            /tmp/wien-maptoolkit-roof-override-pilot.json

      - name: Verify pilot audit
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const data = JSON.parse(
          	fs.readFileSync(
          		"/tmp/wien-maptoolkit-roof-override-pilot.json",
          		"utf8"
          	)
          );
          if (data.count !== 27) {
          	throw new Error("Expected 27 pilot targets, got " + data.count);
          }
          if (!data.allTargetsHaveFeatures) {
          	throw new Error("At least one target has no Maptoolkit feature.");
          }
          console.log(JSON.stringify({
          	targets: data.count,
          	totalFeatures: data.totalFeatures,
          	totalSharedFeatures: data.totalSharedFeatures,
          	allFeaturesExclusive: data.allFeaturesExclusive,
          	sharedTargets: data.rows
          		.filter((row) => row.sharedFeatureCount > 0)
          		.map((row) => ({
          			code: row.historicalCode,
          			sharedFeatureCount: row.sharedFeatureCount,
          			features: row.features.filter((item) => !item.exclusive)
          		}))
          }, null, 2));
          NODE

      - uses: actions/upload-artifact@v7
        with:
          name: wien-maptoolkit-roof-override-pilot
          path: /tmp/wien-maptoolkit-roof-override-pilot.json
          if-no-files-found: error
          retention-days: 5
