name: Analyze Vienna LOD2.1 hybrid pilot

on:
  push:
    branches:
      - feature/wien-lod21-hybrid-remainder
    paths:
      - 'wien-lod21/analyze-hybrid-remainders.mjs'
      - '.github/workflows/wien-lod21-hybrid-pilot.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Check hybrid analyzer syntax
        run: node --check wien-lod21/analyze-hybrid-remainders.mjs

      - name: Analyze Straußengasse hybrid remainders
        run: |
          node wien-lod21/analyze-hybrid-remainders.mjs \
            wien-lod21/targets.production.json \
            /tmp/wien-lod21-hybrid-pilot.json

      - name: Prepare three-target hybrid build
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const source = JSON.parse(fs.readFileSync("wien-lod21/targets.production.json", "utf8"));
          const wanted = new Set(["009238", "113842", "212535"]);
          const buildings = source.buildings.filter((item) => wanted.has(String(item.historicalCode)));
          if (buildings.length !== 3) throw new Error("Expected three hybrid pilot targets.");
          fs.writeFileSync("/tmp/wien-lod21-hybrid-targets.json", JSON.stringify({
          	schemaVersion: 1,
          	status: "hybrid-pilot",
          	zoom: 15,
          	extent: 8192,
          	buildings
          }, null, "\t") + "\n");
          NODE

      - name: Build hybrid pilot meshes
        env:
          WIEN_LOD21_TARGETS: /tmp/wien-lod21-hybrid-targets.json
        run: |
          chmod +x wien-lod21/run.sh
          bash wien-lod21/run.sh

      - name: Validate hybrid pilot meshes
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";

          const root = "wien-lod21/build/WienBuildingsLOD21";
          const release = JSON.parse(fs.readFileSync(path.join(root, "release.json"), "utf8"));
          const targets = JSON.parse(fs.readFileSync(path.join(root, "targets.json"), "utf8"));
          if (release.counts.targets !== 3) {
          	throw new Error("Expected 3 hybrid pilot targets.");
          }
          if (release.counts.hybridRemainderTargets !== 3) {
          	throw new Error(
          		"Expected 3 hybrid remainder targets, got "
          		+ release.counts.hybridRemainderTargets
          	);
          }
          for (const target of targets.targets) {
          	if (!(target.hybridRemainder?.syntheticObjects > 0)) {
          		throw new Error(
          			"No hybrid remainder mesh for " + target.historicalCode
          		);
          	}
          }

          let remainderRecords = 0;
          const tileRoot = path.join(root, "tiles", "15");
          for (const x of fs.readdirSync(tileRoot)) {
          	const xRoot = path.join(tileRoot, x);
          	for (const name of fs.readdirSync(xRoot)) {
          		if (!name.endsWith(".bin")) continue;
          		const buffer = fs.readFileSync(path.join(xRoot, name));
          		const metadataLength = buffer.readUInt32LE(28);
          		const metadata = JSON.parse(
          			buffer.subarray(32, 32 + metadataLength).toString("utf8")
          		);
          		remainderRecords += metadata.buildings.filter(
          			(item) => item.recordKind === "ogd-remainder"
          		).length;
          	}
          }
          if (!(remainderRecords > 0)) {
          	throw new Error("No ogd-remainder records in hybrid pilot tiles.");
          }
          console.log(JSON.stringify({
          	counts: release.counts,
          	remainderRecords,
          	hybrid: targets.targets.map((target) => ({
          		code: target.historicalCode,
          		remainder: target.hybridRemainder
          	}))
          }, null, 2));
          NODE

      - name: Upload hybrid mesh pilot
        uses: actions/upload-artifact@v7
        with:
          name: wien-lod21-hybrid-mesh-pilot
          path: wien-lod21/build/WienBuildingsLOD21/
          if-no-files-found: error
          retention-days: 3
          compression-level: 6

      - name: Upload hybrid pilot analysis
        uses: actions/upload-artifact@v7
        with:
          name: wien-lod21-hybrid-pilot-analysis
          path: /tmp/wien-lod21-hybrid-pilot.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 6

# exact-seam-pilot: 1
