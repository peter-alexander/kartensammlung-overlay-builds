name: Audit Vienna roof cross-tile target

# Revalidation trigger: 2026-09-24 after live cross-tile visual check

on:
  push:
    branches:
      - feature/wien-maptoolkit-roof-loss-analysis
    paths:
      - '.github/workflows/wien-maptoolkit-roof-cross-tile-audit.yml'

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WIEN_ROOF_OVERRIDE_CODES: "120593,137772,226564"
      WIEN_ROOF_OVERRIDE_TILE_RADIUS: "1"
      WIEN_ROOF_OVERRIDE_FETCH_ATTEMPTS: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --package-lock=false @mapbox/vector-tile pbf

      - uses: actions/download-artifact@v8
        with:
          name: wien-maptoolkit-roof-loss-lod21-analysis
          path: /tmp/roof-loss
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35913353237

      - name: Audit target across neighbouring tiles
        run: |
          node wien-buildings/analyze-maptoolkit-override-pilot.mjs \
            /tmp/roof-loss/wien-roof-loss-summary.json \
            /tmp/wien-maptoolkit-roof-cross-tile.json

          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const data = JSON.parse(
          	fs.readFileSync(
          		"/tmp/wien-maptoolkit-roof-cross-tile.json",
          		"utf8"
          	)
          );
          if (data.count !== 3) {
          	throw new Error("Expected three targets, got " + data.count);
          }
          if (!data.allTargetsHaveFeatures || !data.allFeaturesExclusive) {
          	throw new Error("Cross-tile feature ownership is not exclusive.");
          }
          console.log(JSON.stringify(data.rows, null, 2));
          NODE

      - uses: actions/upload-artifact@v7
        with:
          name: wien-maptoolkit-roof-cross-tile-audit
          path: /tmp/wien-maptoolkit-roof-cross-tile.json
          if-no-files-found: error
          retention-days: 3
