name: Refresh server catalogs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'server-catalogs/**'
      - '.github/scripts/main-ftp-upload-file.sh'
      - '.github/workflows/server-catalogs.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches:
      - main
    paths:
      - 'server-catalogs/**'
      - '.github/scripts/main-ftp-upload-file.sh'
      - '.github/workflows/server-catalogs.yml'
      - 'package.json'
      - 'package-lock.json'
  schedule:
    - cron: '23 */6 * * *'

concurrency:
  group: server-catalogs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MAIN_FTP_HOST: ${{ secrets.MAIN_FTP_HOST }}
      MAIN_FTP_USER: ${{ secrets.MAIN_FTP_USER }}
      MAIN_FTP_PASSWORD: ${{ secrets.MAIN_FTP_PASSWORD }}
      MAIN_REMOTE_ROOT: ${{ vars.MAIN_REMOTE_ROOT }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Build public server catalogs
        run: node server-catalogs/build.mjs

      - name: Deploy catalogs to Lima
        if: github.event_name != 'pull_request'
        run: |
          test -n "$MAIN_REMOTE_ROOT"
          chmod +x .github/scripts/main-ftp-upload-file.sh

          for file in server-catalogs/build/*.js server-catalogs/build/*.json; do
            file_name="$(basename "$file")"
            .github/scripts/main-ftp-upload-file.sh \
              "$file" \
              "${MAIN_REMOTE_ROOT%/}/ServerNames/$file_name"
          done
