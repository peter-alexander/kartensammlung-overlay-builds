name: Build Stadtplan Wien snapshot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'stadtplan-wien/**'
      - '.github/scripts/main-ftp-upload-file.sh'
      - '.github/workflows/stadtplan-wien.yml'
  push:
    branches:
      - main
    paths:
      - 'stadtplan-wien/**'
      - '.github/scripts/main-ftp-upload-file.sh'
      - '.github/workflows/stadtplan-wien.yml'
  schedule:
    - cron: '19 */2 * * *'

concurrency:
  group: stadtplan-wien-snapshot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MAIN_FTP_HOST: ${{ secrets.MAIN_FTP_HOST }}
      MAIN_FTP_USER: ${{ secrets.MAIN_FTP_USER }}
      MAIN_FTP_PASSWORD: ${{ secrets.MAIN_FTP_PASSWORD }}
      MAIN_REMOTE_ROOT: ${{ vars.MAIN_REMOTE_ROOT }}
      CURRENT_STYLE_URL: https://fahrrad.lima-city.de/Maps/StadtplanWien/style.json

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Test snapshot builder
        run: node stadtplan-wien/test.mjs

      - name: Build complete snapshot
        run: node stadtplan-wien/build.mjs

      - name: Check whether production style changed
        id: changed
        run: |
          if curl -fsS --retry 3 --retry-delay 2 -o /tmp/current-stadtplan-wien-style.json "$CURRENT_STYLE_URL" \
            && cmp -s /tmp/current-stadtplan-wien-style.json stadtplan-wien/build/style.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Stadtplan Wien snapshot unchanged."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Stadtplan Wien snapshot changed or production style is unavailable."
          fi

      - name: Deploy immutable release files to Lima
        if: github.event_name != 'pull_request' && steps.changed.outputs.changed == 'true'
        run: |
          test -n "$MAIN_REMOTE_ROOT"
          chmod +x .github/scripts/main-ftp-upload-file.sh

          release_id="$(tr -d '\r\n' < stadtplan-wien/build/release-id.txt)"
          release_dir="stadtplan-wien/build/releases/$release_id"
          test -n "$release_id"
          test -d "$release_dir"

          while IFS= read -r -d '' file; do
            relative="${file#"$release_dir/"}"
            .github/scripts/main-ftp-upload-file.sh \
              "$file" \
              "${MAIN_REMOTE_ROOT%/}/StadtplanWien/releases/$release_id/$relative"
          done < <(find "$release_dir" -type f -print0 | sort -z)

      - name: Publish style pointer last
        if: github.event_name != 'pull_request' && steps.changed.outputs.changed == 'true'
        run: |
          test -n "$MAIN_REMOTE_ROOT"
          chmod +x .github/scripts/main-ftp-upload-file.sh
          .github/scripts/main-ftp-upload-file.sh \
            stadtplan-wien/build/style.json \
            "${MAIN_REMOTE_ROOT%/}/StadtplanWien/style.json"
