name: Probe Vienna LOD2.1 TU candidate

on:
  push:
    branches:
      - feature/wien-lod21-production
    paths:
      - '.github/workflows/probe-wien-lod21-tu.yml'

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: wien-lod21-citywide-final-analysis
          path: /tmp/lod21-analysis
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35779704000
      - run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const report=JSON.parse(fs.readFileSync("/tmp/lod21-analysis/wien-lod21-citywide-final.json","utf8"));
          const items=(report.results||[]).filter(x=>String(x.historicalCode)==="006973");
          const direct=(report.directCandidates||[]).filter(x=>String(x.historicalCode)==="006973");
          console.log(JSON.stringify({items,direct},null,2));
          NODE
