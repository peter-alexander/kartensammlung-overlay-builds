name: Refresh Copernicus WMTS catalog

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'copernicus-wmts/**'
      - '.github/scripts/main-ftp-upload-file.sh'
      - '.github/scripts/copernicus-sync-config.mjs'
      - '.github/workflows/copernicus-wmts.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches:
      - main
    paths:
      - 'copernicus-wmts/**'
      - '.github/scripts/main-ftp-upload-file.sh'
      - '.github/scripts/copernicus-sync-config.mjs'
      - '.github/workflows/copernicus-wmts.yml'
      - 'package.json'
      - 'package-lock.json'
  schedule:
    - cron: '41 */6 * * *'

concurrency:
  group: copernicus-wmts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COPERNICUS_INSTANCE_ID: ${{ secrets.COPERNICUS_INSTANCE_ID }}
      COPERNICUS_CLIENT_ID: ${{ secrets.COPERNICUS_CLIENT_ID }}
      COPERNICUS_CLIENT_SECRET: ${{ secrets.COPERNICUS_CLIENT_SECRET }}
      MAIN_FTP_HOST: ${{ secrets.MAIN_FTP_HOST }}
      MAIN_FTP_USER: ${{ secrets.MAIN_FTP_USER }}
      MAIN_FTP_PASSWORD: ${{ secrets.MAIN_FTP_PASSWORD }}
      MAIN_REMOTE_ROOT: ${{ vars.MAIN_REMOTE_ROOT }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Test Copernicus WMTS parser
        run: node copernicus-wmts/test.mjs

      - name: Require Copernicus secrets outside pull requests
        if: github.event_name != 'pull_request'
        run: |
          test -n "$COPERNICUS_INSTANCE_ID"
          test -n "$COPERNICUS_CLIENT_ID"
          test -n "$COPERNICUS_CLIENT_SECRET"

      - name: Sync managed Sentinel Hub layers
        if: github.event_name != 'pull_request' && github.event_name != 'schedule'
        run: node .github/scripts/copernicus-sync-config.mjs

      - name: Build live Copernicus WMTS catalog
        if: env.COPERNICUS_INSTANCE_ID != ''
        run: node copernicus-wmts/build.mjs

      - name: Deploy catalog to Lima
        if: github.event_name != 'pull_request'
        run: |
          test -n "$COPERNICUS_INSTANCE_ID"
          test -n "$MAIN_REMOTE_ROOT"
          chmod +x .github/scripts/main-ftp-upload-file.sh
          .github/scripts/main-ftp-upload-file.sh \
            copernicus-wmts/build/CopernicusWmtsCatalog.json \
            "${MAIN_REMOTE_ROOT%/}/CopernicusWmtsCatalog.json"
          .github/scripts/main-ftp-upload-file.sh \
            copernicus-wmts/build/CopernicusWmtsCatalog.js \
            "${MAIN_REMOTE_ROOT%/}/CopernicusWmtsCatalog.js"
