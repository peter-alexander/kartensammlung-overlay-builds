name: Probe Vienna roof position

on:
  push:
    branches:
      - feature/wien-maptoolkit-roof-loss-analysis
    paths:
      - '.github/workflows/probe-wien-roof-position.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - run: npm install --no-save --package-lock=false @mapbox/vector-tile pbf

      - name: Probe current OGD and Maptoolkit
        run: |
          node --input-type=module <<'NODE'
          import { VectorTile } from "@mapbox/vector-tile";
          import { PbfReader } from "pbf";

          const point = { lng: 16.372257, lat: 48.197761 };
          const tile = { z: 15, x: 17874, y: 11363 };

          function pointInRing(point, ring) {
          	let inside = false;
          	for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
          		const a = ring[i];
          		const b = ring[j];
          		if (
          			(a[1] > point.lat) !== (b[1] > point.lat)
          			&& point.lng < (
          				(b[0] - a[0]) * (point.lat - a[1])
          				/ ((b[1] - a[1]) || Number.EPSILON)
          				+ a[0]
          			)
          		) inside = !inside;
          	}
          	return inside;
          }

          function polygonContainsPoint(geometry, point) {
          	const polygons = geometry?.type === "Polygon"
          		? [geometry.coordinates]
          		: geometry?.type === "MultiPolygon"
          			? geometry.coordinates
          			: [];
          	for (const polygon of polygons) {
          		if (!polygon?.length || !pointInRing(point, polygon[0])) continue;
          		if (polygon.slice(1).some((ring) => pointInRing(point, ring))) continue;
          		return true;
          	}
          	return false;
          }

          function geometryDistanceSquared(geometry, point) {
          	let best = Infinity;
          	const visit = (value) => {
          		if (!Array.isArray(value)) return;
          		if (
          			value.length >= 2
          			&& Number.isFinite(Number(value[0]))
          			&& Number.isFinite(Number(value[1]))
          		) {
          			const dx = Number(value[0]) - point.lng;
          			const dy = Number(value[1]) - point.lat;
          			best = Math.min(best, dx * dx + dy * dy);
          			return;
          		}
          		for (const child of value) visit(child);
          	};
          	visit(geometry?.coordinates);
          	return best;
          }

          async function fetchTile(url) {
          	const response = await fetch(url);
          	if (!response.ok) throw new Error(url + " HTTP " + response.status);
          	return new VectorTile(new PbfReader(await response.arrayBuffer()));
          }

          const releaseResponse = await fetch(
          	"https://tiles.radlobby.at/WienBuildings/release.json?probe=" + Date.now()
          );
          const release = await releaseResponse.json();
          console.log("WienBuildings release", release.generatedAt);

          const ogd = await fetchTile(
          	"https://tiles.radlobby.at/WienBuildings/tiles/15/17874/11363.pbf?v="
          	+ encodeURIComponent(release.generatedAt)
          );
          const mtk = await fetchTile(
          	"https://mtk.wien.gv.at/dataconnector/wien/buildings3d/15/17874/11363.pbf"
          );

          function inspect(label, vectorTile) {
          	console.log(label + " layers", Object.keys(vectorTile.layers));
          	for (const [layerName, layer] of Object.entries(vectorTile.layers)) {
          		const matches = [];
          		for (let index = 0; index < layer.length; index += 1) {
          			const feature = layer.feature(index);
          			let geojson;
          			try {
          				geojson = feature.toGeoJSON(tile.x, tile.y, tile.z);
          			} catch {
          				continue;
          			}
          			const contains = polygonContainsPoint(geojson.geometry, point);
          			const distance2 = geometryDistanceSquared(geojson.geometry, point);
          			if (contains || distance2 < 2.5e-8) {
          				matches.push({
          					index,
          					contains,
          					distance2,
          					id: feature.id ?? null,
          					properties: feature.properties,
          					geometryType: geojson.geometry?.type
          				});
          			}
          		}
          		matches.sort((a, b) => (
          			Number(b.contains) - Number(a.contains)
          			|| a.distance2 - b.distance2
          		));
          		if (matches.length) {
          			console.log(label + " " + layerName, JSON.stringify(matches.slice(0, 12)));
          		}
          	}
          }

          inspect("OGD", ogd);
          inspect("MAPTOOLKIT", mtk);
          NODE

      - name: Match historical LOD2.1 006944
        run: |
          cat >/tmp/wien-roof-gap.json <<'JSON'
          {
          	"generatedAt": "2026-09-24T20:36:00Z",
          	"candidateSheets": ["105079"],
          	"lod21CodeCandidates": [{
          		"historicalCode": "006944",
          		"partCount": 3,
          		"ownerBwGebIds": ["5288572"],
          		"maxHeight": 19.906,
          		"lng": 16.372257,
          		"lat": 48.197761,
          		"lod21Sheet": "105079",
          		"lod21Sheets": ["105079"],
          		"ksIds": [],
          		"sameCodeTotalParts": 3,
          		"sameCodeMatchedParts": 0,
          		"sameCodeOwnerBwGebIds": ["5288572"]
          	}],
          	"lod21SpatialCandidates": []
          }
          JSON
          node wien-lod21/match-candidates.mjs \
          	--input /tmp/wien-roof-gap.json \
          	--output /tmp/wien-roof-match.json \
          	--all
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const report = JSON.parse(fs.readFileSync("/tmp/wien-roof-match.json", "utf8"));
          console.log("HISTORICAL_MATCH", JSON.stringify(report.results?.[0] || null));
          console.log("DIRECT_CANDIDATES", JSON.stringify(report.directCandidates || []));
          console.log("HYBRID_CANDIDATES", JSON.stringify(report.hybridCandidates || []));
          NODE

      - name: Measure historical roof heights 006944
        run: |
          mkdir -p /tmp/lod21-105079
          curl --fail --silent --show-error --location --retry 3 \
          	"https://www.wien.gv.at/MA41datenviewer/downloads/geodaten/lod2_gml/105079_lod2_gml.zip" \
          	-o /tmp/105079.zip
          unzip -q /tmp/105079.zip -d /tmp/lod21-105079
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          import { DOMParser } from "@xmldom/xmldom";

          const GML_NS = "http://www.opengis.net/gml";
          const BLDG_NS = "http://www.opengis.net/citygml/building/1.0";

          function localName(node) {
          	return String(node?.localName || node?.nodeName || "").replace(/^.*:/, "");
          }
          function children(node) {
          	const out = [];
          	for (let child = node?.firstChild; child; child = child.nextSibling) {
          		if (child.nodeType === 1) out.push(child);
          	}
          	return out;
          }
          function descendant(node, ns, name) {
          	return node?.getElementsByTagNameNS?.(ns, name)?.[0] || null;
          }
          function text(node) {
          	return String(node?.textContent || "").trim();
          }
          function buildingName(building) {
          	const direct = children(building).find((child) => localName(child) === "name");
          	return direct ? text(direct) : text(descendant(building, GML_NS, "name"));
          }
          function roofType(building) {
          	return text(descendant(building, BLDG_NS, "roofType"));
          }
          function parseRing(linearRing) {
          	const posList = descendant(linearRing, GML_NS, "posList");
          	const values = text(posList).split(/\s+/).map(Number).filter(Number.isFinite);
          	const out = [];
          	for (let i = 0; i + 2 < values.length; i += 3) {
          		out.push([values[i], values[i + 1], values[i + 2]]);
          	}
          	if (
          		out.length > 1
          		&& out[0][0] === out.at(-1)[0]
          		&& out[0][1] === out.at(-1)[1]
          		&& out[0][2] === out.at(-1)[2]
          	) out.pop();
          	return out;
          }
          function surfaces(building) {
          	const out = [];
          	const boundedBy = building.getElementsByTagNameNS(BLDG_NS, "boundedBy");
          	for (let i = 0; i < boundedBy.length; i += 1) {
          		const surfaceNode = children(boundedBy[i])[0];
          		if (!surfaceNode) continue;
          		const kind = localName(surfaceNode) === "RoofSurface"
          			? "roof"
          			: localName(surfaceNode) === "GroundSurface"
          				? "ground"
          				: localName(surfaceNode) === "WallSurface"
          					? "wall"
          					: "other";
          		const polygons = surfaceNode.getElementsByTagNameNS(GML_NS, "Polygon");
          		for (let p = 0; p < polygons.length; p += 1) {
          			const exterior = descendant(descendant(polygons[p], GML_NS, "exterior"), GML_NS, "LinearRing");
          			const ring = parseRing(exterior);
          			if (ring.length >= 3) out.push({ kind, ring });
          		}
          	}
          	return out;
          }
          function median(values) {
          	const a = [...values].sort((x, y) => x - y);
          	const m = Math.floor(a.length / 2);
          	return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
          }
          function quantile(values, q) {
          	const a = [...values].sort((x, y) => x - y);
          	const pos = (a.length - 1) * q;
          	const lo = Math.floor(pos), hi = Math.ceil(pos);
          	return lo === hi ? a[lo] : a[lo] * (hi - pos) + a[hi] * (pos - lo);
          }
          function mode(values, step = 0.1) {
          	const counts = new Map();
          	for (const v of values) {
          		const key = (Math.round(v / step) * step).toFixed(3);
          		counts.set(key, (counts.get(key) || 0) + 1);
          	}
          	return Number([...counts.entries()].sort((a, b) => b[1] - a[1] || Number(a[0]) - Number(b[0]))[0][0]);
          }

          const files = fs.readdirSync("/tmp/lod21-105079", { recursive: true })
          	.filter((name) => /\.gml$/i.test(String(name)))
          	.map((name) => path.join("/tmp/lod21-105079", String(name)));
          const rows = [];
          for (const file of files) {
          	const doc = new DOMParser().parseFromString(fs.readFileSync(file, "utf8"), "application/xml");
          	const buildings = doc.getElementsByTagNameNS(BLDG_NS, "Building");
          	for (let i = 0; i < buildings.length; i += 1) {
          		const building = buildings[i];
          		if (buildingName(building) !== "006944") continue;
          		const s = surfaces(building);
          		const ground = s.filter((x) => x.kind === "ground").flatMap((x) => x.ring);
          		const roofs = s.filter((x) => x.kind === "roof");
          		const roofPoints = roofs.flatMap((x) => x.ring);
          		const wallPoints = s.filter((x) => x.kind === "wall").flatMap((x) => x.ring);
          		const baseZ = Math.min(...ground.map((p) => p[2]));
          		const roofZ = roofPoints.map((p) => p[2]);
          		const surfaceMin = roofs.map((r) => Math.min(...r.ring.map((p) => p[2])));
          		const wallUpper = wallPoints.map((p) => p[2]).filter((z) => z > baseZ + 1);
          		rows.push({
          			roofType: roofType(building),
          			baseZ,
          			peakHeightM: Math.max(...roofZ) - baseZ,
          			minRoofHeightM: Math.min(...roofZ) - baseZ,
          			surfaceMinMedianHeightM: median(surfaceMin) - baseZ,
          			roofVertexP10HeightM: quantile(roofZ, 0.10) - baseZ,
          			roofVertexModeHeightM: mode(roofZ, 0.1) - baseZ,
          			wallUpperModeHeightM: mode(wallUpper, 0.1) - baseZ,
          			roofRiseM: Math.max(...roofZ) - Math.min(...roofZ),
          			roofSurfaces: roofs.length
          		});
          	}
          }
          console.log("HEIGHT_ANALYSIS_006944", JSON.stringify(rows));
          NODE
