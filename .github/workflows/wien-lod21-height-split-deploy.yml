name: Deploy validated Vienna height-split package

on:
  push:
    branches:
      - feature/wien-lod21-height-split-pilot
    paths:
      - '.github/workflows/wien-lod21-height-split-deploy.yml'

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REMOTE_ROOT: ${{ vars.EASYNAME_REMOTE_ROOT }}
      EASYNAME_FTP_HOST: ${{ secrets.EASYNAME_FTP_HOST }}
      EASYNAME_FTP_USER: ${{ secrets.EASYNAME_FTP_USER }}
      EASYNAME_FTP_PASSWORD: ${{ secrets.EASYNAME_FTP_PASSWORD }}
      LFTP_PARALLEL: 6

    steps:
      - uses: actions/checkout@v7

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - uses: actions/download-artifact@v8
        with:
          name: wien-lod21-production-height-split
          path: /tmp/WienBuildingsLOD21
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35910554612

      - name: Verify exact validated artifact
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const root = "/tmp/WienBuildingsLOD21";
          const release = JSON.parse(fs.readFileSync(root + "/release.json", "utf8"));
          const manifest = JSON.parse(fs.readFileSync(root + "/targets.json", "utf8"));
          const expected = {
          	targets: 2273,
          	directStrong: 1209,
          	hybridA: 614,
          	hybridBAbsolute: 72,
          	hybridBThin: 3,
          	hybridBClip: 7,
          	hybridCClip: 169,
          	hybridDClip: 169,
          	hybridEaveClip: 26,
          	hybridHeightSplit: 2,
          	manualPilotStrong: 1,
          	manualPilotHybrid: 1
          };
          if (release.status !== "production") throw new Error("Not production.");
          for (const [key, value] of Object.entries(expected)) {
          	if (Number(release.counts?.[key]) !== value) {
          		throw new Error(
          			"Expected " + key + "=" + value
          			+ ", got " + release.counts?.[key]
          		);
          	}
          }
          const items = manifest.targets || [];
          if (items.length !== 2273) throw new Error("Expected 2273 manifest targets.");
          const split = items.filter(
          	(item) => item.rolloutMode === "hybrid-height-split"
          );
          if (split.length !== 2) throw new Error("Expected two height-split targets.");
          for (const item of split) {
          	const hs = item.historicalClip?.heightSplit;
          	if (
          		item.auditedHeightSplit !== true
          		|| !hs
          		|| Number(hs.toleranceM) !== 0.25
          		|| Number(item.historicalClip?.minRoofCoverageRatio) < 0.995
          		|| Number(item.historicalClip?.geometricWallBoundaryCoverageRatio) < 0.999
          		|| Number(item.historicalClip?.uncoveredWallBoundaryLengthM) > 0.01
          	) {
          		throw new Error(item.historicalCode + ": invalid height split artifact");
          	}
          }
          console.log(JSON.stringify({
          	counts: release.counts,
          	heightSplit: split.map((item) => ({
          		code: item.historicalCode,
          		split: item.historicalClip.heightSplit,
          		remainder: item.hybridRemainder
          	}))
          }, null, 2));
          NODE

      - name: Deploy exact validated artifact
        run: |
          chmod +x .github/scripts/lftp-upload.sh
          REMOTE_BASE="${REMOTE_ROOT:+$REMOTE_ROOT/}WienLOD21"
          .github/scripts/lftp-upload.sh /tmp/WienBuildingsLOD21 "$REMOTE_BASE"
