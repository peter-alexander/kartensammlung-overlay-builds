name: Test Vienna LOD2.1 Hybrid-A

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Download validated citywide analysis
        uses: actions/download-artifact@v8
        with:
          name: wien-lod21-citywide-final-analysis
          path: /tmp/lod21-analysis
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35779704000

      - name: Generate Hybrid-A test targets
        run: |
          node wien-lod21/make-production-targets.mjs \
            --report /tmp/lod21-analysis/wien-lod21-citywide-final.json \
            --pilot wien-lod21/targets.pilot.json \
            --output /tmp/wien-lod21-hybrid-a-targets.json \
            --include-hybrid-a

          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const input = JSON.parse(fs.readFileSync("/tmp/wien-lod21-hybrid-a-targets.json", "utf8"));
          const counts = input.counts || {};
          if (counts.total !== 1825) throw new Error("Expected 1825 targets.");
          if (counts.directStrong !== 1209) throw new Error("Expected 1209 direct targets.");
          if (counts.hybridA !== 614) throw new Error("Expected 614 Hybrid-A targets.");
          if (counts.manualPilotStrong !== 1) throw new Error("Expected one manual strong pilot.");
          if (counts.manualPilotHybrid !== 1) throw new Error("Expected one manual hybrid pilot.");
          console.log(JSON.stringify(counts, null, 2));
          NODE

      - name: Build Hybrid-A test package
        env:
          WIEN_LOD21_TARGETS: /tmp/wien-lod21-hybrid-a-targets.json
          WIEN_LOD21_DOWNLOAD_PARALLEL: 4
        run: |
          chmod +x wien-lod21/run.sh
          /usr/bin/time -v bash wien-lod21/run.sh

      - name: Validate Hybrid-A package
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";

          const root = "wien-lod21/build/WienBuildingsLOD21";
          const release = JSON.parse(fs.readFileSync(path.join(root, "release.json"), "utf8"));
          const targets = JSON.parse(fs.readFileSync(path.join(root, "targets.json"), "utf8"));

          if (release.counts.targets !== 1825) {
          	throw new Error("Expected 1825 targets, got " + release.counts.targets);
          }
          if (release.counts.directStrong !== 1209) {
          	throw new Error("Expected 1209 direct targets.");
          }
          if (release.counts.hybridA !== 614) {
          	throw new Error("Expected 614 Hybrid-A targets, got " + release.counts.hybridA);
          }
          if (release.counts.manualPilotStrong !== 1) {
          	throw new Error("Expected one manual strong pilot.");
          }
          if (release.counts.manualPilotHybrid !== 1) {
          	throw new Error("Expected one manual hybrid pilot.");
          }
          if (release.counts.hybridRemainderTargets !== 615) {
          	throw new Error(
          		"Expected 615 hybrid remainder targets, got "
          		+ release.counts.hybridRemainderTargets
          	);
          }

          const hybrid = targets.targets.filter((target) => (
          	target.rolloutMode === "hybrid-a"
          	|| target.rolloutMode === "manual-pilot-hybrid"
          ));
          if (hybrid.length !== 615) {
          	throw new Error("Expected 615 hybrid targets in target manifest.");
          }
          const missingRemainders = hybrid.filter(
          	(target) => !(target.hybridRemainder?.syntheticObjects > 0)
          );
          if (missingRemainders.length) {
          	throw new Error(
          		"Hybrid targets without remainder meshes: "
          		+ missingRemainders.slice(0, 20)
          			.map((target) => target.historicalCode)
          			.join(", ")
          	);
          }

          console.log(JSON.stringify({
          	counts: release.counts,
          	sourceSheets: release.source.sheets.length,
          	targetManifestBytes: fs.statSync(path.join(root, "targets.json")).size,
          	tileCount: release.tiles.presentTilesZ15.length
          }, null, 2));
          NODE

      - name: Upload Hybrid-A test package
        uses: actions/upload-artifact@v7
        with:
          name: wien-lod21-hybrid-a-test
          path: wien-lod21/build/WienBuildingsLOD21/
          if-no-files-found: error
          retention-days: 3
          compression-level: 6
