name: Deploy shared Easyname host helpers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'shared-host/**'
      - '.github/workflows/shared-host.yml'

concurrency:
  group: shared-easyname-host-helpers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REMOTE_ROOT: ${{ vars.EASYNAME_REMOTE_ROOT }}
      EASYNAME_FTP_HOST: ${{ secrets.EASYNAME_FTP_HOST }}
      EASYNAME_FTP_USER: ${{ secrets.EASYNAME_FTP_USER }}
      EASYNAME_FTP_PASSWORD: ${{ secrets.EASYNAME_FTP_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install deploy dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Validate PHP syntax
        run: |
          php -l shared-host/php-health.php
          php -l shared-host/asset-versions.php

      - name: Deploy PHP health endpoint
        run: |
          chmod +x .github/scripts/lftp-upload.sh
          REMOTE_HEALTH="${REMOTE_ROOT:+$REMOTE_ROOT/}php-health.php"
          .github/scripts/lftp-upload.sh shared-host/php-health.php "$REMOTE_HEALTH"

      - name: Deploy asset version endpoint
        run: |
          chmod +x .github/scripts/lftp-upload.sh
          REMOTE_MANIFEST="${REMOTE_ROOT:+$REMOTE_ROOT/}asset-versions.php"
          .github/scripts/lftp-upload.sh shared-host/asset-versions.php "$REMOTE_MANIFEST"

      - name: Verify public PHP runtime
        run: |
          HEALTH_FILE="$(mktemp)"
          trap 'rm -f "$HEALTH_FILE"' EXIT
          curl \
            --silent \
            --show-error \
            --location \
            --fail-with-body \
            --connect-timeout 15 \
            --max-time 20 \
            --output "$HEALTH_FILE" \
            "https://tiles.radlobby.at/php-health.php?verify=$(date +%s)"
          if [ ! -s "$HEALTH_FILE" ]; then
            echo "PHP health endpoint returned an empty body." >&2
            exit 1
          fi
          node - "$HEALTH_FILE" <<'NODE'
          const fs = require("fs");
          const health = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (health?.ok !== true) {
            throw new Error("PHP health endpoint did not report ok=true.");
          }
          if (health?.versionReadable !== true) {
            throw new Error("PHP cannot read WienBuildings/LOD1/ks-version.txt.");
          }
          console.log(`Easyname PHP ${health.php}; Wiener dataset version ${health.version}`);
          NODE

      - name: Verify public asset version endpoint
        run: |
          chmod +x shared-host/verify-asset-versions.sh
          bash shared-host/verify-asset-versions.sh
