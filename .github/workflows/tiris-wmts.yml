name: Refresh tiris WMTS basemaps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'tiris/wmts-*.mjs'
      - '.github/workflows/tiris-wmts.yml'
  pull_request:
    paths:
      - 'tiris/wmts-*.mjs'
      - '.github/workflows/tiris-wmts.yml'
  schedule:
    - cron: '33 3 * * 2'

concurrency:
  group: tiris-wmts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MAIN_FTP_HOST: ${{ secrets.MAIN_FTP_HOST }}
      MAIN_FTP_USER: ${{ secrets.MAIN_FTP_USER }}
      MAIN_FTP_PASSWORD: ${{ secrets.MAIN_FTP_PASSWORD }}
      MAIN_REMOTE_ROOT: ${{ vars.MAIN_REMOTE_ROOT }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Test WMTS catalog
        run: node --test tiris/wmts-test.mjs
      - name: Build Tirol WMTS basemaps
        run: node tiris/wmts-build.mjs
      - name: Compare published catalog
        id: changed
        run: |
          if curl -fsS --max-time 15 -o /tmp/tiris-wmts.json \
            https://fahrrad.lima-city.de/Maps/ServerNames/TirisWmts.json \
            && cmp -s /tmp/tiris-wmts.json tiris/build/TirisWmts.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish changed WMTS catalog
        if: github.event_name != 'pull_request' && steps.changed.outputs.changed == 'true'
        run: |
          test -n "$MAIN_REMOTE_ROOT"
          chmod +x .github/scripts/main-ftp-upload-file.sh
          .github/scripts/main-ftp-upload-file.sh \
            tiris/build/TirisWmts.json \
            "${MAIN_REMOTE_ROOT%/}/ServerNames/TirisWmts.json"
