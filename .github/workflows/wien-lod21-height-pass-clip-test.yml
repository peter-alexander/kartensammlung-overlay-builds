name: Test Vienna height-audited clipping

on:
  push:
    branches:
      - feature/wien-lod21-height-audit
    paths:
      - '.github/workflows/wien-lod21-height-pass-clip-test.yml'

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WIEN_LOD21_DOWNLOAD_PARALLEL: 6

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y unzip

      - uses: actions/download-artifact@v8
        with:
          name: wien-lod21-citywide-final-analysis
          path: /tmp/lod21-analysis
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35779704000

      - name: Prepare 25 height-audited clipping targets
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const report = JSON.parse(
          	fs.readFileSync("/tmp/lod21-analysis/wien-lod21-citywide-final.json", "utf8")
          );
          const audit = JSON.parse(
          	fs.readFileSync("wien-lod21/height-audit.generated.json", "utf8")
          );
          const wanted = new Set(audit.automaticHeightCodes || []);
          if (wanted.size !== 25) {
          	throw new Error("Expected 25 audited height codes.");
          }

          const candidates = (report.hybridCandidates || []).filter(
          	(item) => wanted.has(String(item.historicalCode))
          );
          if (candidates.length !== 25) {
          	throw new Error(
          		"Expected 25 source candidates, got " + candidates.length
          	);
          }

          const buildings = candidates.map((candidate) => {
          	const owners = candidate.ownerBwGebIds || [];
          	if (owners.length !== 1) {
          		throw new Error(
          			candidate.historicalCode + ": expected one owner"
          		);
          	}
          	return {
          		name: "Wien LOD2.1 height pass " + candidate.historicalCode,
          		historicalCode: String(candidate.historicalCode),
          		bwGebId: Number(owners[0]),
          		ksIds: candidate.ksIds,
          		sheet: String(candidate.sheet || candidate.lod21Sheet),
          		lng: Number(candidate.lng),
          		lat: Number(candidate.lat),
          		rolloutMode: "hybrid-clip-pilot",
          		expectedHistoricalOutsideM2: Number((
          			Number(candidate.metrics?.oldArea)
          			- Number(candidate.metrics?.intersectionArea)
          		).toFixed(3)),
          		sourceMetrics: candidate.metrics
          	};
          });

          fs.writeFileSync("/tmp/height-pass.json", JSON.stringify({
          	schemaVersion: 1,
          	status: "height-pass-clip-test",
          	zoom: 15,
          	extent: 8192,
          	buildings
          }, null, "\t") + "\n");
          console.log(JSON.stringify({
          	targets: buildings.length,
          	sourceSheets: new Set(
          		buildings.map((item) => item.sheet)
          	).size
          }, null, 2));
          NODE

      - name: Build all height-audited clipping targets
        env:
          WIEN_LOD21_TARGETS: /tmp/height-pass.json
        run: |
          chmod +x wien-lod21/run.sh
          /usr/bin/time -v bash wien-lod21/run.sh

      - name: Audit height-audited clipped meshes
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const root = "wien-lod21/build/WienBuildingsLOD21";
          const release = JSON.parse(
          	fs.readFileSync(root + "/release.json", "utf8")
          );
          const manifest = JSON.parse(
          	fs.readFileSync(root + "/targets.json", "utf8")
          );
          const items = manifest.targets || [];
          if (items.length !== 25 || release.counts.targets !== 25) {
          	throw new Error("Expected 25 built height-audited targets.");
          }

          const failures = [];
          const summary = [];
          for (const target of items) {
          	const clip = target.historicalClip;
          	const remainder = target.hybridRemainder;
          	const expectedRemoved =
          		Number(target.expectedHistoricalOutsideM2);
          	const removed = Number(clip?.removedHistoricalAreaM2);
          	const roofCoverage = Number(clip?.minRoofCoverageRatio);
          	const wallCoverage = Number(
          		clip?.geometricWallBoundaryCoverageRatio
          	);
          	const uncoveredBoundaryM = Number(
          		clip?.uncoveredWallBoundaryLengthM
          	);
          	const maxSliverHoleWidthM = Number(
          		clip?.maxRemovedInteriorSliverHoleMeanWidthM || 0
          	);
          	const rawRemainder =
          		Number(remainder?.rawRemainderAreaM2 || 0);
          	const discardedRemainder =
          		Number(remainder?.discardedSliverAreaM2 || 0);
          	const syntheticObjects =
          		Number(remainder?.syntheticObjects || 0);
          	const meaningfulUnbuiltRemainder = syntheticObjects > 0
          		? 0
          		: Math.max(0, rawRemainder - discardedRemainder);

          	const reasons = [];
          	if (
          		!Number.isFinite(expectedRemoved)
          		|| !Number.isFinite(removed)
          		|| Math.abs(removed - expectedRemoved) > 0.05
          	) reasons.push("removed-area");
          	if (!Number.isFinite(roofCoverage) || roofCoverage < 0.995) {
          		reasons.push("roof-coverage");
          	}
          	if (!Number.isFinite(wallCoverage) || wallCoverage < 0.999) {
          		reasons.push("wall-coverage");
          	}
          	if (
          		!Number.isFinite(uncoveredBoundaryM)
          		|| uncoveredBoundaryM > 0.01
          	) reasons.push("uncovered-boundary");
          	if (
          		!Number.isFinite(maxSliverHoleWidthM)
          		|| maxSliverHoleWidthM > 0.0501
          	) reasons.push("sliver-hole");
          	if (meaningfulUnbuiltRemainder > 0.01) {
          		reasons.push("remainder");
          	}

          	const row = {
          		historicalCode: target.historicalCode,
          		historicalClip: clip,
          		hybridRemainder: remainder,
          		reasons
          	};
          	summary.push(row);
          	if (reasons.length) failures.push(row);
          }

          const result = {
          	total: items.length,
          	passed: items.length - failures.length,
          	failed: failures.length,
          	failures,
          	summary
          };
          fs.writeFileSync(
          	"/tmp/height-pass-clip-summary.json",
          	JSON.stringify(result, null, "\t") + "\n"
          );
          console.log(JSON.stringify({
          	total: result.total,
          	passed: result.passed,
          	failed: result.failed,
          	failures: failures.map((item) => ({
          		code: item.historicalCode,
          		reasons: item.reasons
          	}))
          }, null, 2));
          if (failures.length) {
          	throw new Error(
          		"Height-audited clipping failed for "
          		+ failures.length + " target(s)."
          	);
          }
          NODE

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wien-lod21-height-pass-clip-test
          path: /tmp/height-pass-clip-summary.json
          if-no-files-found: warn
          retention-days: 5
