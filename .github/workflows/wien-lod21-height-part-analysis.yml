name: Analyze Vienna height outlier parts

on:
  push:
    branches:
      - feature/wien-lod21-height-part-analysis
    paths:
      - '.github/workflows/wien-lod21-height-part-analysis.yml'
      - 'wien-lod21/analyze-hybrid-remainders.mjs'

permissions:
  contents: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y unzip

      - uses: actions/download-artifact@v8
        with:
          name: wien-lod21-citywide-final-analysis
          path: /tmp/lod21-analysis
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35779704000

      - name: Prepare three height outliers
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const wanted = new Set(["029048", "074864", "113842"]);
          const report = JSON.parse(
          	fs.readFileSync(
          		"/tmp/lod21-analysis/wien-lod21-citywide-final.json",
          		"utf8"
          	)
          );
          const candidates = (report.hybridCandidates || []).filter(
          	(item) => wanted.has(String(item.historicalCode))
          );
          if (candidates.length !== 3) {
          	throw new Error("Expected three outliers, got " + candidates.length);
          }
          const buildings = candidates.map((candidate) => ({
          	name: "Wien height outlier " + candidate.historicalCode,
          	historicalCode: String(candidate.historicalCode),
          	bwGebId: Number(candidate.ownerBwGebIds?.[0]),
          	ksIds: candidate.ksIds,
          	sheet: String(candidate.sheet || candidate.lod21Sheet),
          	lng: Number(candidate.lng),
          	lat: Number(candidate.lat),
          	rolloutMode: "analysis",
          	sourceMetrics: candidate.metrics
          }));
          fs.writeFileSync("/tmp/height-three.json", JSON.stringify({
          	schemaVersion: 1,
          	status: "analysis",
          	zoom: 15,
          	extent: 8192,
          	buildings
          }, null, "\t") + "\n");
          NODE

      - name: Analyze FMZK parts and historical overlap
        run: |
          node wien-lod21/analyze-hybrid-remainders.mjs           	/tmp/height-three.json           	/tmp/height-three-full.json           	029048,074864,113842
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const full = JSON.parse(
          	fs.readFileSync("/tmp/height-three-full.json", "utf8")
          );
          const summary = {
          	generatedAt: full.generatedAt,
          	report: (full.report || []).map((item) => ({
          		historicalCode: item.historicalCode,
          		currentAreaM2: item.currentAreaM2,
          		historicalAreaM2: item.historicalAreaM2,
          		intersectionAreaM2: item.intersectionAreaM2,
          		currentCoverage: item.currentCoverage,
          		historicalCoverage: item.historicalCoverage,
          		currentPartMetrics: item.currentPartMetrics,
          		currentHeightsM: item.currentHeightsM
          	}))
          };
          fs.writeFileSync(
          	"wien-lod21/height-part-analysis.generated.json",
          	JSON.stringify(summary, null, "\t") + "\n"
          );
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Commit analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wien-lod21/height-part-analysis.generated.json
          git diff --cached --quiet && exit 0
          git commit -m "Record Vienna height-outlier part analysis"
          git push
