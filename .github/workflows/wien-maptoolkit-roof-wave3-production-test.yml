name: Validate Vienna roof replacement wave 3 production

on:
  push:
    branches:
      - feature/wien-maptoolkit-roof-wave3
    paths:
      - '.github/workflows/wien-maptoolkit-roof-wave3-production-test.yml'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WIEN_LOD21_TARGETS: wien-lod21/targets.production.json
      WIEN_LOD21_DOWNLOAD_PARALLEL: 6

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/download-artifact@v8
        with:
          name: wien-lod21-citywide-final-analysis
          path: /tmp/lod21-analysis
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35779704000

      - name: Generate Wave 3 production target snapshot
        run: |
          node wien-lod21/make-production-targets.mjs \
            --report /tmp/lod21-analysis/wien-lod21-citywide-final.json \
            --pilot wien-lod21/targets.pilot.json \
            --roof-replacements wien-lod21/maptoolkit-roof-overrides.production.json \
            --output wien-lod21/targets.production.json \
            --include-hybrid-a \
            --include-hybrid-b-absolute \
            --include-hybrid-b-thin \
            --include-hybrid-b-clip \
            --include-hybrid-c-clip \
            --include-hybrid-d-clip \
            --include-hybrid-eave-clip \
            --include-hybrid-height-split \
            --include-maptoolkit-roof-replacements

      - name: Verify Wave 3 target counts
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const data = JSON.parse(
          	fs.readFileSync("wien-lod21/targets.production.json", "utf8")
          );
          if (Number(data.counts?.total) !== 2300) {
          	throw new Error(
          		"Expected 2300 targets, got " + data.counts?.total
          	);
          }
          if (Number(data.counts?.maptoolkitRoofReplacement) !== 27) {
          	throw new Error(
          		"Expected 27 roof replacements, got "
          		+ data.counts?.maptoolkitRoofReplacement
          	);
          }
          const expectedWave3 = new Set([
          	"066292", "073722", "126551", "169945", "229233"
          ]);
          const replacements = data.buildings.filter(
          	(item) => item.rolloutMode === "maptoolkit-roof-replacement"
          );
          for (const code of expectedWave3) {
          	if (!replacements.some(
          		(item) => String(item.historicalCode) === code
          	)) {
          		throw new Error("Missing Wave 3 target " + code);
          	}
          }
          if (replacements.some(
          	(item) => String(item.historicalCode) === "120593"
          )) {
          	throw new Error(
          		"Tile-edge target 120593 must remain deferred."
          	);
          }
          console.log(JSON.stringify({
          	counts: data.counts,
          	wave3: [...expectedWave3]
          }, null, 2));
          NODE

      - name: Commit regenerated target snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wien-lod21/targets.production.json
          if ! git diff --cached --quiet; then
            git commit -m "Promote Vienna roof replacement wave 3 targets"
            git push
          fi

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Build combined Vienna production package
        run: |
          chmod +x wien-lod21/run.sh
          /usr/bin/time -v bash wien-lod21/run.sh

      - name: Validate combined production package
        run: node wien-lod21/validate-production.mjs wien-lod21/build/WienBuildingsLOD21

      - uses: actions/upload-artifact@v7
        with:
          name: wien-lod21-production-roof-wave3
          path: wien-lod21/build/WienBuildingsLOD21/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
